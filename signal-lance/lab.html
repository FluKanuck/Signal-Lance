<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Signal Lance Visual Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=B612+Mono:wght@400;700&family=Fragment+Mono&family=Michroma&family=Azeret+Mono:wght@400;600&family=Doto:wght@600;800&family=Chakra+Petch:wght@400;600&family=Martian+Mono:wght@400;600&family=Chivo+Mono:wght@400;600&family=Saira+Condensed:wght@500;700&family=Share+Tech+Mono&display=swap">
<style>
/* Lab chrome (plain, top) is deliberately NOT styled by the looks; everything under #hud is. */
:root{--bg:#0b0a10;--ink:#b9b2ff;--dim:#5d5880;--font:monospace;--display:monospace;--hostile:#ff5d73;--objective:#ffd27a;--friend:#fff;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ---------- HUD (micrographics) ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font:11px/1.45 var(--font);color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
#hud>*{position:absolute}
.panel{padding:10px 14px 10px 12px;box-sizing:border-box}
.panel>svg.frame{position:absolute;inset:0;overflow:visible;pointer-events:none}
svg.frame .fill{fill:var(--bg);fill-opacity:.62}
svg.frame .line{fill:none;stroke:var(--ink);stroke-width:1}
svg.frame .solid{fill:var(--ink)}
.panel .body{position:relative}
.row{display:flex;align-items:center;gap:6px;white-space:nowrap}
.row.big{font:600 16px var(--display);letter-spacing:.06em}
.row.hd b{font:600 12px var(--display);letter-spacing:.12em}
.dim,.k{color:var(--dim)}
.foe{color:var(--hostile)}
.cap{font-size:9px;color:var(--dim);letter-spacing:.14em;margin-bottom:2px}
.rule{height:1px;margin:5px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px);opacity:.6}
.pill{border:1px solid var(--ink);border-radius:9px;padding:0 6px;font-size:9px;line-height:14px}
.pill.solid{background:var(--ink);color:var(--bg)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink);box-sizing:border-box}
.dots i.on{background:var(--ink)}
.dots i.sm{width:5px;height:5px}
.seg{display:inline-flex;gap:2px}
.seg i{width:4px;height:9px;background:var(--ink);opacity:.18}
.seg i.on{opacity:1}
.parts{gap:10px}
.part.hurt{color:var(--objective)} .part.hurt i{border-color:var(--objective)} .part.hurt i.on{background:var(--objective)}
.part.gone{color:var(--hostile);text-decoration:line-through}
#hStat{left:calc(10px + env(safe-area-inset-left));top:10px;min-width:300px}
#hInit{right:calc(10px + env(safe-area-inset-right));top:10px}
.lts{display:flex;gap:5px}
.lt{width:20px;height:20px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:10px}
.lt.foe{border-color:var(--hostile);color:var(--hostile)}
.lt.now{background:var(--ink);color:var(--bg)} .lt.foe.now{background:var(--hostile)}
.lt.done{opacity:.35}
#hTgt{left:calc(10px + env(safe-area-inset-left));bottom:12px;min-width:260px}
#hTape{left:50%;top:10px;transform:translateX(-50%);width:min(360px,40vw);height:30px;overflow:hidden;
  -webkit-mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent);mask:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
#hTape .strip{position:absolute;left:50%;top:0;height:100%;transition:transform .3s}
#hTape i{position:absolute;bottom:0;width:1px;height:5px;background:var(--ink);opacity:.6}
#hTape i.mj{height:10px;opacity:1}
#hTape b{position:absolute;bottom:12px;left:-12px;width:24px;text-align:center;font-size:9px;font-weight:400}
#hTape:after{content:'';position:absolute;left:50%;bottom:0;border:5px solid transparent;border-bottom-color:var(--objective);transform:translateX(-50%)}
#hHdg{left:50%;top:42px;transform:translateX(-50%);font-size:9px;color:var(--dim)}
#hBtns{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;pointer-events:auto}
#hud button{position:relative;font:600 11px var(--display);letter-spacing:.1em;color:var(--ink);background:none;border:0;min-width:64px;height:46px;padding:0 10px;text-transform:uppercase}
#hud button small{display:block;font-size:8px;font-weight:400;color:var(--dim);letter-spacing:.08em}
#hud button>span{position:relative}
#hud button.on svg.frame .fill{fill:var(--ink);fill-opacity:1}
#hud button.on{color:var(--bg)} #hud button.on small{color:var(--bg);opacity:.7}
#hud button.off{opacity:.35}
#hud>#hEnd{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:12px;height:56px!important;min-width:110px!important;pointer-events:auto}
#hud button>svg.frame{position:absolute;inset:0;overflow:visible}
.hud-off #hud{display:none}

/* ---------- lab chrome (plain) ---------- */
#lab{position:fixed;top:86px;right:10px;z-index:9;width:270px;max-height:calc(100vh - 100px);overflow-y:auto;touch-action:pan-y;background:rgba(0,0,0,.82);color:#ddd;font:12px system-ui,sans-serif;border:1px solid #444;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
#lab button{font:600 11px system-ui;background:#2a2a2e;color:#ddd;border:1px solid #555;border-radius:5px;padding:6px 8px;cursor:pointer}
#lab button.on{background:#ddd;color:#111}
#lab .r{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#lab select{width:100%;background:#2a2a2e;color:#ddd;border:1px solid #555;border-radius:5px;padding:5px}
#lLook{font-weight:700;letter-spacing:.1em} #lNote,#lTry{opacity:.7;font-size:11px;line-height:1.35}
#lFx{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:11px}
#lPause{position:fixed;top:56px;right:66px;z-index:10;font:600 12px system-ui;background:rgba(0,0,0,.7);color:#ddd;border:1px solid #555;border-radius:5px;padding:4px 10px;min-width:38px}
#lPause.on{background:#ddd;color:#111}
#lSim{position:fixed;top:56px;right:116px;z-index:10;font:600 11px system-ui;background:rgba(0,0,0,.7);color:#ddd;border:1px solid #555;border-radius:5px;padding:4px 8px}
#lSim.on{background:#ddd;color:#111}
#lHide{position:fixed;top:56px;right:10px;z-index:10;font:600 11px system-ui;background:rgba(0,0,0,.7);color:#ddd;border:1px solid #555;border-radius:5px;padding:4px 8px}
.chrome-off #lab{display:none}
#lab details summary{cursor:pointer;font-weight:700;letter-spacing:.08em}
.kn{display:grid;grid-template-columns:82px 1fr 40px;align-items:center;gap:6px;font-size:11px}
.kn input,.kn select{width:100%;min-width:0} .kn b{font-weight:500;opacity:.8;text-align:right}
.kn select{background:#2a2a2e;color:#ddd;border:1px solid #555;border-radius:4px;padding:3px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:3px 8px;margin:6px 0}
.kc{display:flex;align-items:center;gap:5px;font-size:10px} .kc input{width:26px;height:18px;padding:0;border:0;background:none}
.why{font-size:10px;opacity:.6;margin:-2px 0 4px}
.nm{cursor:help;text-decoration:underline dotted rgba(255,255,255,.35);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm.sel{color:#fff;text-decoration-color:#fff}
.tip{position:sticky;top:-10px;z-index:1;background:#1c1c20;border:1px solid #444;border-radius:5px;padding:6px 8px;margin:4px 0 8px;font-size:11px;line-height:1.35;color:#ccc;min-height:28px}
.tip b{color:#fff} .sub{font-size:10px;opacity:.6;margin-top:6px}
#lJson{width:100%;height:120px;font:10px monospace;background:#111;color:#ddd;border:1px solid #555;box-sizing:border-box}
@media (max-width:700px){#hStat{min-width:0;transform:scale(.85);transform-origin:top left}#hTgt{display:none}#lab{width:200px}}
</style>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="hStat" class="panel"><div class="body"></div></div>
  <div id="hTape"><div class="strip"></div></div>
  <div id="hHdg"></div>
  <div id="hInit" class="panel"><div class="body"></div></div>
  <div id="hTgt" class="panel"><div class="body"></div></div>
  <div id="hBtns">
    <button class="on"><span>MOVE<small>NORMAL</small></span></button>
    <button><span>FIRE<small>2 AP</small></span></button>
    <button><span>MORTAR<small>3 AP</small></span></button>
    <button><span>RADAR<small>PULSE</small></span></button>
    <button><span>ECM<small>STBY</small></span></button>
    <button class="off"><span>GHOST<small>NO EN</small></span></button>
  </div>
  <button id="hEnd"><span>END TURN<small>→ NEXT</small></span></button>
</div>
<button id="lSim" title="Pause the sim only; effects keep running (S)">SIM ❚❚</button><button id="lPause" title="Freeze everything (space)">❚❚</button><button id="lHide">LAB ☰</button>
<div id="lab">
  <div class="r" id="lLooks"></div>
  <div><span id="lLook"></span> <div id="lNote"></div></div>
  <select id="lPick"></select>
  <div id="lScen" style="font-weight:600"></div><div id="lTry"></div>
  <div class="r"><button id="lRun">PAUSE</button><button id="lSpeed">×1</button><button id="lRestart">RESTART</button><button id="lFollow">FOLLOW</button><button id="lHud">HUD</button></div>
  <div id="lFx"></div>
  <details open><summary>TUNE</summary>
    <div class="r" style="margin:6px 0"><button id="lCopy">COPY SETTINGS</button><button id="lPaste">PASTE / APPLY</button><button id="lReset">RESET</button></div>
    <textarea id="lJson" hidden spellcheck="false"></textarea>
    <div id="lTune"></div>
  </details>
  <div style="opacity:.55;font-size:10px">drag = pan · wheel/pinch = zoom · dbl-click = follow · ←/→ = look · space = freeze all · S = pause sim only · H = hide panel</div>
</div>
<script type="module" src="./src/lab/main.ts"></script>
