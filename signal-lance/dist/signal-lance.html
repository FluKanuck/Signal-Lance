rders (bottom row, your turn, no AP): HOLD = the transport waits one round, then carries on (`+e.ESCORT_HOLDS+` per hunt). HURRY = its next move is a sprint, `+e.ESCORT_SPRINT+` tiles instead of `+e.ESCORT_MOVE+`, and louder (`+e.ESCORT_HURRIES+` per hunt). Tap again to cancel.`,`NEW (r16-s5): districts are no longer a grid of blocks. They are packed from irregular pieces (half blocks, long strips, L shapes, and the hand-drawn blocks), cut off at the map edge. Streets jog, narrow, close and dead-end; some pieces are small open lots or have courtyards.`,`NEW (r16-s3): the streets between blocks are no longer a clean grid. Some stretches have rubble across them (slow, loud), some are shut by a barricade, and some have a chicane: walls on alternate lanes you can weave through but can’t see straight past.`,`NEW (r16-s3): hover the mouse over anything on the map, or hold a finger on it, to see what it is and what it does. A hold never moves or selects.`,`Escort routes follow the open streets: at each fork, up to three legs, NORTH, AHEAD (straight on) and SOUTH, only where the streets let you through.`,`MAP button on this screen: NEW DISTRICTS (default) or OLD HIVE (the old map), to compare. Play at least one hunt on the old map.`,`TEST BED: "Long way round", "Two districts: strip" and "Two districts: square", and "Crunch".`],round:16,howTo:`Play the four new scenarios first, then about 10 hunts in contracts on new districts (and one on the old hive). After each hunt, tap the answers (the first one matters most) and add a note, especially if tap-to-move fought you. When you finish, tap SEND LOG and send it to Jamie.`},Aa=[{round:15,title:`Round 15: Pick your fights`,lines:[`Jobs come in four types, shown on top of each job card: UPLINK (stand in the ring and uplink), BOUNTY, RETRIEVE and ESCORT.`,`BOUNTY: every kill pays that enemy’s bounty (prices on the CARD). Reach the quota for a win, then extract when you choose. The field has extra enemies.`,`RETRIEVE: PICK UP the guarded cargo. That alerts the whole field, which hunts the carrier (who can’t sprint). HAND OFF to the other mech, carry it out the right edge.`,`ESCORT: a friendly transport walks from the left edge to the right. Keep it alive; at each fork it waits for you to tap a route on the map.`]},{round:14,title:`Round 14: Read the signature`,lines:[`Every enemy is one of 9 variants (3 patrols, 3 turrets, 3 emplacements). They fight differently.`,`Tap a contact to see what your sensors picked up (EMIT, pulses, moved or still, steps or a shot heard). The CARD lists the 9 with one bold TELL each; "3 fit" shows how many still match.`,`ID calls a contact. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`,`The TEST BED (loadout screen): short scenarios that test one thing each.`]},{round:13,title:`Round 13: Loud gets company`,lines:[`Noise is two things. EMIT (orange) is electronic: radar, ECM and uplink. It builds up, fades slowly and carries far.`,`SOUND (pale ring with ticks) is moving and shooting. One radius per turn, heard through walls, gone at your next turn. A heard-only contact is a hollow SOUND square: never enough to shoot.`,`Patrols carry radios (a small steady EMIT), so passive sensors find them. Turrets stay silent.`,`Two legs: lose one and you can only CREEP; lose both and you creep at half distance.`,`THE PACK (splash toggle): one enemy that senses you alerts others nearby, and patrols leave their posts to hunt you.`]},{round:12,title:`Round 12: Pick your shot`,lines:[`Shots roll to hit: FIRE shows your chance and the yellow ODDS line shows why (range, target moved, cover, a loud target).`,`A hit strikes a part: core, legs, weapon or sensors. Same rules for the enemy. Part damage carries through the contract; REPAIR fixes the worst part first.`]}],ja=[{k:`map`,q:`This district…`,a:[`Changed my plan`,`Didn't change it`,`Not sure`]},{k:`clutter`,q:`Scrap and rubble…`,a:[`Crossed it on purpose`,`Went round it`,`Never in my way`,`Heard an enemy crunch`]},{k:`move`,q:`Tap-to-move…`,a:[`Did what I wanted`,`Took clutter I’d avoid`,`Walked a line I didn’t want`,`Couldn’t look down a street`]}],Ma=[[`Goal`,`Each job has a type (top of the job card). UPLINK: stand in the gold ring and tap UPLINK on 3 turns, or destroy every enemy. BOUNTY: kills pay their bounty (prices on the CARD); reach the quota for a win, then extract at the right edge when you choose. RETRIEVE: PICK UP the cargo (the whole field then hunts the carrier, who can’t sprint), HAND OFF if needed, carry it out the right edge. ESCORT: keep the transport alive from the left edge to the right; at each fork, tap a route on the map (NORTH, AHEAD or SOUTH, where the streets are open). You can set the route at forks ahead of time (lit ✓); an unset fork stops it. HOLD makes it wait a round; HURRY makes it sprint its next move (3 of each per hunt). The gold dashed ring shows where its next move ends; T in the turn strip is its turn. Lose if both mechs are destroyed.`],[`Turns`,`Everyone acts in initiative order (strip, top right). On your mech's turn you spend AP (the ● pips). END TURN passes to the next unit.`],[`Move`,`Tap the map to plot a path. Pick CREEP, NORM or SPRINT, then tap MOVE. Faster covers more ground but is louder.`],[`Find`,`Enemies are hidden. A contact is a red square with a circle: the circle is how unsure you are. Passive sensors draw cyan bearing lines; two crossing lines make a fix. RADAR gives a sharp fix but is very loud.`],[`Fight`,`Tap a contact to select it. FIRE needs a tight fix, range and line of sight; the button says why if it's blocked, or shows your hit chance. Hits strike a part (core, legs, weapon, sensors). Cover (a wall or scrap close to the target) costs −25%, unless you are right up against the same piece of cover yourself. MORTAR fires on a fix with no line of sight, but scatters more on a fuzzy one.`],[`Noise`,`Two kinds. EMIT (orange bar, orange dashed ring) is electronic: radar, ECM and uplink add to it, it fades a little each turn, and passive sensors pick it up from far away. SOUND (pale ring with ticks) is moving and shooting: one radius per turn (the loudest thing you did), heard through walls, gone at your next turn.`],[`Ground`,`Every hunt is a new district (the job card gives its size), packed from irregular city pieces, so streets jog, narrow and dead-end. Blue dotted areas are quiet ground: you are harder to hear there. Amber hatched areas are noise: fixes on anything inside are blurry. Brown speckled scrap is slow (2 tiles of movement a tile) and loud (+3 sound), but it is low cover. Rusty outlined shapes are walls: set pieces in the blocks, and barricades that shut a street. A chicane (walls on alternate lanes) can be weaved through but not seen past.`],[`ID`,`Enemies come in 9 variants. Tap a contact to see what your sensors have picked up about it, open the CARD to compare, then tap ID to call it. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`],[`ECM`,`ECM masks you each turn it is on. GHOST places a fake contact for enemies.`],[`Camera`,`Drag to pan. Z+ / Z− zoom. CTR recentres.`],[`Look`,`Hover the mouse over anything on the map, or hold a finger on it, to see what it is and what it does.`],[`Debug`,`DEBUG: REROLL JOBS (job screen) rolls two new jobs for the same hunt, e.g. to get the job type you want to test. The log line notes it.`]],Na=`<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;font:bold 12px monospace" aria-label="Map legend">
