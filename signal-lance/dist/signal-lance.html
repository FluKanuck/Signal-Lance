PED`,screen:`hunt`,line:`Your ExoS sensed a new contact, so the move stopped there. You keep the AP and EN for the part you did not walk.`},{id:`TAP WHERE TO FACE`,name:`TAP WHERE TO FACE`,screen:`hunt`,line:`You tapped your own ExoS. Tap the map to turn it that way. Tap the ExoS again to cancel. Turning is free.`},{id:`shots`,name:`shots`,screen:`hunt`,line:`Shots this ExoS fired this turn. Each ExoS can fire `+n.SHOTS_PER_TURN+` times a turn.`},{id:`ODDS`,name:`ODDS`,screen:`hunt`,line:`The chance that FIRE hits the selected contact now. Range, cover, your movement and a right ID change it.`},{id:`AMMO`,name:`AMMO`,screen:`hunt`,line:`Gun rounds left in this ExoS. Buy more between hunts on the REFIT tab (+10 RDS).`},{id:`SHELLS`,name:`SHELLS`,screen:`hunt`,line:`Mortar shells left in this ExoS. Buy more between hunts on the REFIT tab (+1 SHELL).`},{id:`KILLS`,name:`KILLS`,screen:`hunt`,line:`Enemy units destroyed in this hunt, out of the whole field.`},{id:`TIME`,name:`TIME`,screen:`hunt`,line:`Hunt time in minutes and seconds.`},{id:`T`,name:`T`,screen:`hunt`,line:`The transport’s place in the ORDER strip.`},{id:`FIRE`,name:`FIRE`,screen:`hunt`,line:`FIRE shoots the selected contact, or the best one. It needs a fix of ±`+n.PLAYER_FIRE_UNC+` tiles or better, range and line of sight.`},{id:`MORTAR`,name:`MORTAR`,screen:`hunt`,line:`MORTAR lobs a shell over walls. Tap MORTAR, then tap a contact (aimed) or the map (blind). It is loud.`},{id:`ID`,name:`ID`,screen:`hunt`,line:`Your call on which variant the selected contact is. A right call before you see it adds +`+n.HIT_ID_BONUS+`% to hit. Compare with the CARD.`},{id:`CARD`,name:`CARD`,screen:`hunt`,line:`The enemy reference. It lists every variant, what each one gives off, and the tell that sets it apart.`},{id:`END TURN`,name:`END TURN`,screen:`hunt`,line:`Ends this ExoS’s turn. The next unit in the ORDER strip acts. Unspent AP carries over, up to `+n.AP_BANK_MAX+`.`},{id:`UPLINK`,name:`UPLINK`,screen:`hunt`,line:`Stand in the gold ring and tap UPLINK, once a turn. `+n.UPLINK_TURNS+` UPLINKs win. Each costs `+n.AP_UPLINK+` AP and adds `+n.SIG_UPLINK+` EMIT.`},{id:`CARGO`,name:`CARGO`,screen:`hunt`,line:`Pick up the cargo and carry it out at the right edge. After the PICK UP, every enemy knows where the carrier is.`},{id:`PICK UP`,name:`PICK UP`,screen:`hunt`,line:`Picks up the cargo. Stand within `+(n.UPLINK_RADIUS+.5)+` tiles of its centre. It costs `+n.RETRIEVE_PICKUP_AP+` AP.`},{id:`HAND OFF`,name:`HAND OFF`,screen:`hunt`,line:`Gives the cargo to a lancemate within `+n.RETRIEVE_HANDOFF_RANGE+` tiles. It costs `+n.RETRIEVE_HANDOFF_AP+` AP.`},{id:`BOUNTY`,name:`BOUNTY`,screen:`hunt`,line:`Each kill pays that enemy’s price from the CARD. Reach the quota to win, then EXTRACT when you choose.`},{id:`EXTRACT`,name:`EXTRACT`,screen:`hunt`,line:`Takes this ExoS off the map. Stand in the green zone at the right edge first. It costs no AP.`},{id:`TRANSPORT`,name:`TRANSPORT`,screen:`hunt`,line:`The unarmed vehicle you escort. It must walk out at the right edge. If the enemy destroys it, the hunt fails.`},{id:`HOLD`,name:`HOLD`,screen:`hunt`,line:`An order to the transport: skip its next move. It costs no AP. Tap HOLD again to cancel.`},{id:`HURRY`,name:`HURRY`,screen:`hunt`,line:`An order to the transport: SPRINT its next move, `+n.ESCORT_SPRINT+` tiles, louder. It costs no AP. Tap HURRY again to cancel.`},{id:`ROUTE`,name:`ROUTE`,screen:`hunt`,line:`The transport’s way at a fork. Pick it in the ROUTE bar above the bottom buttons, or on the map. A ✓ marks it.`},{id:`TRANSPORT HIT`,name:`TRANSPORT HIT`,screen:`hunt`,line:`The enemy hit the transport. The line says how many hits it has left. At 0 it is destroyed and the hunt fails.`},{id:`Z+`,name:`Z+`,screen:`hunt`,line:`Zooms the map in. Z− zooms out.`},{id:`Z−`,name:`Z−`,screen:`hunt`,line:`Zooms the map out. Z+ zooms in.`},{id:`CTR`,name:`CTR`,screen:`hunt`,line:`Centres the map on the active ExoS. The map follows it again until you drag.`},{id:`QUIT`,name:`QUIT`,screen:`hunt`,line:`Stops the hunt. In a contract you then pick SAVE & QUIT or BAIL CONTRACT.`},{id:`SAVE & QUIT`,name:`SAVE & QUIT`,screen:`hunt`,line:`Saves this exact turn and goes to the company screen. RESUME puts you back on this turn.`},{id:`BAIL CONTRACT`,name:`BAIL CONTRACT`,screen:`hunt`,line:`Gives up the contract. You lose the fee and the completion bonus. You still pay wages and upkeep. The menu shows the cost first.`},{id:`DBG`,name:`DBG`,screen:`hunt`,line:`Debug lines for testers. It shows the truth about the field, so leave it off when you play.`},{id:`HITS LEFT`,name:`HITS LEFT`,screen:`hunt`,line:`CORE hits left on this ExoS. At 0 it goes DOWN. A hit on a part that is gone goes to the CORE.`},{id:`DOWN`,name:`DOWN`,screen:`hunt`,line:`The ExoS lost its CORE and can’t act for the rest of the hunt. Its operator is CRITICAL.`},{id:`CRITICAL`,name:`CRITICAL`,screen:`hunt`,line:`The operator of a DOWN ExoS. End a lancemate’s turn next to it to carry them. Left behind, they are KIA.`},{id:`CARRIED BY`,name:`CARRIED BY`,screen:`hunt`,line:`A lancemate carries this CRITICAL operator. Get the carrier out with EXTRACT. The operator then sits out `+n.OP_BENCH+` contracts.`},{id:`EXTRACTED`,name:`EXTRACTED`,screen:`hunt`,line:`This ExoS left the map. The hunt ends when all your ExoS that can still act are out.`},{id:`CORE`,name:`CORE`,screen:`hunt`,line:`The body. When the CORE runs out, the ExoS is DOWN and an enemy is destroyed. On the CARD, “core 3” is its CORE hits.`},{id:`LEGS`,name:`LEGS`,screen:`hunt`,line:`Any damage to the LEGS means CREEP only. With the LEGS gone, CREEP covers half the distance.`},{id:`ARMS`,name:`ARMS`,screen:`hunt`,line:`The weapon part. When the ARMS are gone, the gun on them stops working.`},{id:`MAST`,name:`MAST`,screen:`hunt`,line:`The sensor part. When the MAST is gone, its sensors stop and your eyes see half as far.`},{id:`BACK`,name:`BACK`,screen:`hunt`,line:`The rear part, with the mortar and utility kit. Only shots from behind your facing hit it.`},{id:`ok`,name:`ok`,screen:`hunt`,line:`Part state: no damage.`},{id:`scratched`,name:`scratched`,screen:`hunt`,line:`Part state: it lost a little. It still works.`},{id:`bloodied`,name:`bloodied`,screen:`hunt`,line:`Part state: half its hits or fewer are left. It still works.`},{id:`badly`,name:`badly`,screen:`hunt`,line:`Part state: a quarter of its hits or fewer are left. It still works.`},{id:`gone`,name:`gone`,screen:`hunt`,line:`Part state: destroyed for the rest of the hunt. What is on it stops. REPAIR WORST between hunts brings it back.`},{id:`contact`,name:`contact`,screen:`contact`,line:`A red square with a circle: an enemy your sensors fixed. The circle shows how unsure the fix is. Tap it to select it.`},{id:`FIX`,name:`±`,screen:`contact`,line:`How unsure the fix is, in tiles (±2.5t). FIRE needs ±`+n.PLAYER_FIRE_UNC+` or better. More sensors and eyes make it smaller.`},{id:`UNKNOWN`,name:`UNKNOWN`,screen:`contact`,line:`You don’t know this contact’s variant yet. Use ID to make a call, or get eyes on it.`},{id:`fit`,name:`fit`,screen:`contact`,line:`“7 fit” means 7 variants on the CARD match what your sensors noted. Fewer fit means you are closer to an ID.`},{id:`SELECTED`,name:`SELECTED`,screen:`contact`,line:`The yellow box: the contact FIRE, ID and RADAR use. Tap empty ground or your own ExoS to clear it.`},{id:`EO`,name:`EO`,screen:`contact`,line:`Eyes fixed it: exact, in line of sight. EO A means ExoS A saw it.`},{id:`RDR`,name:`RDR`,screen:`contact`,line:`RADAR fixed it. 2W means through 2 walls, so the fix is still fuzzy.`},{id:`ESM`,name:`ESM`,screen:`contact`,line:`Your passive sensor heard its EMIT. Bearings from two or more places cross to make the fix.`},{id:`ACO`,name:`ACO`,screen:`contact`,line:`Heard only: its SOUND. A sound fix is never tight enough to FIRE at.`},{id:`MZL`,name:`MZL`,screen:`contact`,line:`Muzzle flash: it fired at you, so you have a rough fix on where it fired from.`},{id:`LINK`,name:`LINK`,screen:`contact`,line:`A track shared by your lance. It is never a lock on its own.`},{id:`SCAN`,name:`SCAN`,screen:`contact`,line:`The ship’s scan before the drop. A SCAN tag means the scan saw the unit there, so it may have moved.`},{id:`LOST TRACK`,name:`LOST TRACK`,screen:`contact`,line:`An orange contact: no sensor holds it now. The circle grows while that unit acts, then the contact drops off.`},{id:`LAST SEEN`,name:`LAST SEEN`,screen:`contact`,line:`A faded mark where a contact dropped off your picture, with its round. It stays `+n.LASTKNOWN_ROUNDS+` rounds. You can’t target it.`},{id:`BEARING`,name:`BEARING`,screen:`map`,line:`A teal line from your ExoS toward an EMIT it heard. Where two lines cross, the contact is.`},{id:`PAINTED`,name:`PAINTED`,screen:`map`,line:`An enemy RADAR swept this ExoS in that round. The red ring alone gives no direction. The RWR module adds one.`},{id:`RWR`,name:`RWR`,screen:`map`,line:`Radar warning receiver. Rings show how close the radar is. The spoke points at it. The label is the CARD’s best guess.`},{id:`COVER`,name:`COVER`,screen:`map`,line:`A wall near the target: −`+n.HIT_COVER+`% to hit. Scrap: −`+n.HIT_COVER_LOW+`%. It doesn’t count if the shooter is against the same piece.`},{id:`QUIET`,name:`QUIET`,screen:`map`,line:`Blue dotted ground. Anything here gives off `+np(n.ZONE_TYPES.QUIET.SIG_MULT)+` of its EMIT and SOUND. IN QUIET means your ExoS stands in it.`},{id:`NOISE`,name:`NOISE`,screen:`map`,line:`An amber hatched zone. Fixes on anything inside are blurred. Eyes and RADAR still work. IN NOISE means your ExoS stands in it.`},{id:`ZONE ?`,name:`ZONE ?`,screen:`map`,line:`The ship’s scan found a zone here, but not its type. THERMAL tells QUIET from NOISE.`},{id:`EXTRACTION`,name:`EXTRACTION`,screen:`map`,line:`The green zone at the right edge. Stand in it and tap EXTRACT.`},{id:`SPLASH`,name:`SPLASH`,screen:`map`,line:`Where the last mortar shell landed, and whether it hit.`},{id:`scrap`,name:`scrap`,screen:`map`,line:`Brown speckled ground. Each tile costs `+n.CLUTTER_TILE_COST+` tiles of movement, adds `+n.CLUTTER_SOUND+` SOUND, and gives low cover.`},{id:`NEXT`,name:`NEXT MOVE`,screen:`map`,line:`Where the transport’s next move ends.`},{id:`THERMAL`,name:`THERMAL`,screen:`scan`,line:`The ship’s heat sensor. It finds warm units and their size, and tells QUIET from NOISE. Cold turrets stay hidden.`},{id:`EM LISTEN`,name:`EM LISTEN`,screen:`scan`,line:`The ship’s ESM. It hears only units that transmit: first a count, then a fix with the CARD’s best guess.`},{id:`FULL MAP`,name:`FULL MAP`,screen:`scan`,line:`Puts the selected sensor over the whole map at a quarter strength. RING aims it again.`},{id:`RING`,name:`RING`,screen:`scan`,line:`Aims the selected sensor at its ring. Drag near a ring to move it.`},{id:`ALT`,name:`ALT`,screen:`scan`,line:`Ship altitude. HIGH: big, weak, fuzzy rings, and quiet. LOW: small, strong, sharp rings, and loud. MID is standard.`},{id:`CLOCK`,name:`CLOCK`,screen:`scan`,line:`Ship-minutes on station. Time passes only while the clock runs. PAUSE to think.`},{id:`RISK`,name:`RISK`,screen:`scan`,line:`How much the field noticed your scan. It climbs while sensors are on and cools with all of them off.`},{id:`STEP`,name:`STEP`,screen:`scan`,line:`RISK in steps. A new step may call in an enemy unit. The step at the drop wakes part of the field.`},{id:`SCAN WINDOW`,name:`SCAN WINDOW`,screen:`scan`,line:`The ship-minutes this job allows for the scan. When it closes, you drop.`},{id:`NO TIME LIMIT`,name:`NO TIME LIMIT`,screen:`scan`,line:`This job has no SCAN WINDOW. Scan for as long as the RISK allows.`},{id:`DROP ZONE`,name:`DROP ZONE`,screen:`scan`,line:`Where your ExoS land. RADAR clears the north and south ones. Tap a numbered one to pick it.`},{id:`ping`,name:`ping`,screen:`scan`,line:`A unit RADAR found. A ping gives where, never what.`},{id:`JOB`,name:`JOB`,screen:`city`,line:`A job on the city map. Take it and it becomes your CONTRACT: 2 to 4 hunts for one fee.`},{id:`CONTRACT`,name:`CONTRACT`,screen:`city`,line:`The job you took. Win its hunts to complete it and get the fee. Each hunt pays a little too.`},{id:`FACTION JOB`,name:`FACTION JOB`,screen:`city`,line:`A faction pays ×`+n.CITY_FACTION_PAY+` to hit a rival. Complete it: the employer likes you more, the target likes you less.`},{id:`BROKER JOB`,name:`BROKER JOB`,screen:`city`,line:`A deniable job: ×`+n.CITY_BROKER_PAY+` pay. No faction hires you openly. The target still likes you less, and its friends notice.`},{id:`STANDING`,name:`STANDING`,screen:`city`,line:`How much a faction likes you. Only a completed job moves it. Every contract it fades `+n.STANDING_DRIFT+` toward 0.`},{id:`HATED`,name:`HATED`,screen:`city`,line:`STANDING `+n.STANDING_HATED+` or lower. Their jobs are more dangerous, more of their field is awake, and their fuel costs more.`},{id:`NEUTRAL`,name:`NEUTRAL`,screen:`city`,line:`STANDING between HATED and LIKED. Nothing extra happens.`},{id:`LIKED`,name:`LIKED`,screen:`city`,line:`STANDING +`+n.STANDING_LIKED+` or higher. Their jobs pay ×`+n.STANDING_LIKED_PAY+`, jobs on their enemies come with a FREE SCAN, and their fuel is cheap.`},{id:`FREE SCAN`,name:`FREE SCAN`,screen:`city`,line:`A LIKED faction’s gift: the scan opens with RADAR band 1 on the whole map, at no RISK.`},{id:`RIVALS`,name:`RIVALS`,screen:`city`,line:`Two factions that dislike each other. Work for one, and the other likes you less.`},{id:`ALLIES`,name:`ALLIES`,screen:`city`,line:`Two factions that stand together. Hit one, and the other likes you less too.`},{id:`DANGER`,name:`DANGER`,screen:`city`,line:`LOW, MEDIUM or HIGH: how big and how tough the field is.`},{id:`FUEL`,name:`FUEL`,screen:`city`,line:`The ship jumps on fuel: `+n.CITY_FUEL_PER_LINK+` a link on the city map. Buy it at the MARKET. With no fuel you can’t reach a job.`},{id:`INTEL`,name:`INTEL`,screen:`city`,line:`The job card’s listing: the district, the field, the zones and what the field listens on.`},{id:`Listens on`,name:`Listens on`,screen:`city`,line:`What the enemy senses with: SOUND (steps and shots), eyes, ESM (your EMIT), RADAR and IR sights (your heat).`},{id:`FORK`,name:`FORK`,screen:`city`,line:`An escort route splits here. Pick a ROUTE, or the transport stops and waits.`},{id:`DROPS`,name:`DROPS`,screen:`company`,line:`This operator drops in this ExoS on the next hunt. Tap to change who drives it.`},{id:`STAYS ABOARD`,name:`STAYS ABOARD`,screen:`company`,line:`This ExoS stays on the ship this hunt. Tap to give it an operator.`},{id:`BENCHED`,name:`BENCHED`,screen:`company`,line:`An operator who was carried out CRITICAL. They sit out `+n.OP_BENCH+` contracts.`},{id:`KIA`,name:`KIA`,screen:`company`,line:`Killed in action: an operator left behind CRITICAL. Their name goes on the MEMORIAL.`},{id:`XP`,name:`XP`,screen:`company`,line:`Experience. Operators earn it for each hunt they come back from. At level 2 (★) and 3, their skill gets stronger.`},{id:`STEADY AIM`,name:`STEADY AIM`,screen:`company`,line:`Operator skill: +`+n.SKILL_AIM[0]+`% to hit, more at higher levels.`},{id:`QUIET MOVER`,name:`QUIET MOVER`,screen:`company`,line:`Operator skill: quieter moves (SOUND ×`+n.SKILL_QUIET[0]+`), more at higher levels. Shots are as loud as before.`},{id:`SHARP EARS`,name:`SHARP EARS`,screen:`company`,line:`Operator skill: this ExoS hears SOUND ×`+n.SKILL_EARS[0]+` further, more at higher levels.`},{id:`SENSOR TECH`,name:`SENSOR TECH`,screen:`company`,line:`Operator skill: fixes on contacts get tight faster.`},{id:`cr`,name:`cr`,screen:`company`,line:`Credits: the company’s money. Hunt pay and fees come in. Wages, upkeep and repairs go out.`},{id:`PARTS`,name:`PARTS`,screen:`company`,line:`Spare parts for REPAIR WORST and REBUILD. Kills give salvage parts. The MARKET sells them.`},{id:`WAGES`,name:`WAGES`,screen:`company`,line:`Paid to every operator on the roster when a contract ends, benched ones too.`},{id:`UPKEEP`,name:`UPKEEP`,screen:`company`,line:`The ship’s running cost, paid when a contract ends.`},{id:`DEBT`,name:`DEBT`,screen:`company`,line:`Credits below 0. The company can be in debt for one contract, down to −`+n.DEBT_LIMIT+`. Deeper, or still in debt next time, it folds.`},{id:`FOLDED`,name:`FOLDED`,screen:`company`,line:`The company is finished. Debt can do it. So can losing every ExoS with no way to rebuild one.`},{id:`REPAIR WORST`,name:`REPAIR WORST`,screen:`company`,line:`Repairs 1 hit on this ExoS’s worst part. It costs parts and credits.`},{id:`REBUILD`,name:`REBUILD`,screen:`company`,line:`Builds a destroyed ExoS again. After a hunt where you held the field, it costs half.`},{id:`+10 RDS`,name:`+10 RDS`,screen:`company`,line:`Buys 10 gun rounds for this ExoS.`},{id:`+1 SHELL`,name:`+1 SHELL`,screen:`company`,line:`Buys 1 mortar shell for this ExoS.`},{id:`MEMORIAL`,name:`MEMORIAL`,screen:`company`,line:`The names of operators killed in action (KIA).`},{id:`REFIT`,name:`REFIT`,screen:`company`,line:`The company tab for your ExoS: damage, repairs, rounds and shells.`},{id:`ROSTER`,name:`ROSTER`,screen:`company`,line:`The company tab for your operators. The letter buttons put an operator in that ExoS.`},{id:`MARKET`,name:`MARKET`,screen:`company`,line:`Buy parts, fuel, items and recruits. Now and then it sells an ExoS.`},{id:`SHIP`,name:`SHIP`,screen:`company`,line:`Seven hardpoints for ship modules. Each module changes one rule, for example a quieter drop or a faster scan.`},{id:`HANGAR`,name:`HANGAR`,screen:`hangar`,line:`Where you fit each ExoS. Tap a part, then tap a hardpoint to fit an item you own.`},{id:`LOAD`,name:`LOAD`,screen:`hangar`,line:`Weight carried. Over the rated load, every move is louder and costs more EN. Far over it, moves cost +1 AP.`},{id:`POWER`,name:`POWER`,screen:`hangar`,line:`EN back each turn: the reactor’s output minus what your items draw. The pool is the most EN you can hold.`},{id:`HITS`,name:`HITS`,screen:`hangar`,line:`How many hits each part takes before it is gone.`},{id:`hardpoint`,name:`hardpoint`,screen:`hangar`,line:`A slot on a part for one item: SENSOR, WEAPON, INTERNAL, UTILITY or MOBILITY. OPEN takes anything.`},{id:`LAUNCH`,name:`LAUNCH HUNT`,screen:`hangar`,line:`Drops the lance with these fits. The fits then lock for the contract.`},{id:`card.emit`,name:`EMIT none / low / high`,screen:`card`,line:`How much a variant transmits. None is radio-silent. Low→high means quiet, then a spike after each RADAR pulse.`},{id:`LOCK`,name:`lock`,screen:`card`,line:`How sure an enemy must be before it fires. A tight or firm lock needs a sharp fix. A looser lock fires sooner.`},{id:`shot`,name:`shot`,screen:`card`,line:`“shot 12” is how far away you hear that variant fire, in tiles. A muffled shot is hard to hear.`},{id:`steps`,name:`steps`,screen:`card`,line:`How loud a patrol walks: soft (3 or less), steps (4–5) or loud (6 or more). It is the patrol’s tell.`},{id:`pulses`,name:`pulses`,screen:`card`,line:`How often an emplacement pulses its RADAR. The rhythm tells the variants apart.`},{id:`rds`,name:`rds`,screen:`card`,line:`Rounds of ammunition.`},{id:`TURNING POINT`,name:`TURNING POINT`,screen:`after`,line:`A moment that changed the hunt. T7 means turn 7. Tap one to see the map as it was then.`},{id:`WHAT IT COST`,name:`WHAT IT COST`,screen:`after`,line:`People, repairs, pay, salvage and the books for this hunt. ← T7 points to the turning point behind a line.`},{id:`HELD THE FIELD`,name:`HELD THE FIELD`,screen:`after`,line:`You did the job. You see the whole story, and your DOWN ExoS come home. A REBUILD costs half.`},{id:`FIELD LOST`,name:`FIELD LOST`,screen:`after`,line:`You didn’t hold the field. Enemy TURNING POINTS show as ??? with a rough direction. The wrecks stay out there.`},{id:`THE BOOKS`,name:`THE BOOKS`,screen:`after`,line:`The company’s money at a contract’s end: fee, bonus, wages, upkeep and repairs, then the credits left.`}],ap={ROUND:`Every `+n.LIVE_ROUND_SEC+` s of the clock is ine`,tile:[36,13],face:[33,13],state:`PATROL`}],contacts:[{field:0,unc:1,src:`RADAR`},{field:1,unc:1.5,src:`RADAR`},{field:2,unc:3,src:`PASSIVE`,who:`A+B`}],question:{q:`Could you see and tap every contact?`,a:[`Yes, all of them`,`Most of them`,`No, buttons were in the way`,`Something else`]}},{name:`Hated`,round:23,seed:2301,books:!0,city:`Hated`,uplink:[0,0],lance:[],field:[],tryThis:`The Foundry hates you. Job 1 is in one of their districts. Look at its danger, the fuel price where the ship sits, and what completing it would do. TAKE IT to see its scan: the risk meter says how much more of the field is awake.`,question:{q:`Could you see what your standing cost or earned you?`,a:[`Yes, clearly`,`Some of it`,`No, I missed it`,`Too much to read`]}},{name:`Liked`,round:23,seed:2301,books:!0,city:`Liked`,uplink:[0,0],lance:[],field:[],tryThis:`The Corporate side likes you, and posts job 1 against the Foundry. Look at its pay, the fuel price where the ship sits, then TAKE IT: the scan opens with their intel already on the map.`,question:{q:`Could you see what your standing cost or earned you?`,a:[`Yes, clearly`,`Some of it`,`No, I missed it`,`Too much to read`]}},{name:`Held the field`,round:22,...fh,tryThis:`Watch only: the lance plays itself and takes the uplink, then the after-action page opens. Read WHAT HAPPENED and WHAT IT COST, tap a TURNING POINT to see it on the map. Then play Bailed: the same hunt, ending as a bail.`},{name:`Bailed`,round:22,...fh,endAs:`BAIL`,tryThis:`The same hunt as Held the field, but it ends as a BAIL at the same moment. You lost the field, so the enemy’s side of the story is blanked out (???, a rough direction). Compare it with Held the field.`},{name:`Thin books`,round:21,seed:2103,books:!0,tryThis:`Your company is in debt: if it is still below 0 when the next contract ends, it folds. Three offers: rich and far (HIGH danger, 4 hunts, all your fuel), safe and poor (LOW, 2 hunts), and one in between. Look at the books, your ExoS and your people, then TAKE one.`,uplink:[0,0],lance:[],field:[],question:{q:`What decided your pick?`,a:[`The fee`,`The fuel`,`The danger`,`My hurt suit or people`,`Not sure`]}},{name:`Carry them out`,round:21,seed:2101,mission:`UPLINK`,packed:ch,tryThis:`B is down and Jok, its operator, is CRITICAL. End A’s turn next to B (it’s 2 tiles behind you) to carry Jok, then EXTRACT on the east edge, or take the uplink. Leave Jok behind and Jok is KIA. A patrol is walking up the street toward you.`,uplink:[41,13],lance:[{tile:[22,13],face:[41,13],fit:`line`,op:[`Mara Voss`,`AIM`,2]},{tile:[20,13],face:[41,13],fit:`scout`,op:[`Jok Okafor`,`QUIET`,1],downed:!0}],field:[{type:`PATROL`,variant:`line`,tile:[33,13],face:[22,13],state:`PATROL`}],question:{q:`Was it worth going back for them?`,a:[`Yes, worth it`,`Yes, but it cost me`,`No, too risky: left them`,`Didn’t know I could`]}},{name:`Loud and fast`,round:20,seed:2025,mission:`UPLINK`,job:{seed:2025,comp:`Ambush`,listen:-1,scan:`0W0.1_0G_11S`},tune:{SCAN_MODE:`active`,SCAN_DEADLINE_CHANCE:0},tryThis:`The ship has had RADAR on the full map for almost 3 minutes: the RISK meter is just under step 1. Every step may call a unit in, and the step you drop at decides how much of the field wakes. Push on, switch to the quiet sensors, or wait for it to cool, then drop and take the uplink.`,uplink:[0,0],lance:[{tile:[0,0],fit:`line`},{tile:[0,0],fit:`scout`}],field:[],question:{q:`Did you stop before the risk, or push?`,a:[`Stopped before the step`,`Waited for it to cool`,`Pushed on: worth it`,`Pushed on: regretted it`,`Didn’t notice the meter`]}},{name:`Where first`,round:20,seed:2025,mission:`UPLINK`,job:{seed:2025,comp:`Ambush`,listen:-1},tune:{SCAN_MODE:`active`},tryThis:`Scan before you land. Pick a sensor, drag the aim ring, tap START CLOCK, and PAUSE when you have enough. RADAR finds everything (even silent units) but not what it is. THERMAL shows what is warm. EM LISTEN names what talks. Two units here never talk. Then pick a DROP ZONE t half or less, the line turns red.`,`NEW: the scan says which DROP ZONE is picked and how to change it.`,`NEW: the contract result shows THE BOOKS: credits at the start, hunt pay, spending, the fee and bonus, wages, upkeep and credits now. Each line adds up.`,`NEW: job cards show the completion bonus (+`+n.CONTRACT_BONUS+` cr) next to the fee. BAIL CONTRACT says that you lose both, and that hunt pay you earned stays.`,`NEW: THE BOOKS on the company screen list every way the company can fold.`,`NEW (r24-s2): on a phone held sideways, the HUD is one line: the ExoS, AP, EN, the objective and any warning. Tap the line to see the full HUD, and tap it again to close it.`,`NEW: the map keeps your active ExoS, the selected contact and the objective clear of the buttons. Contact labels near the right edge flip to the left.`,`NEW: map labels no longer print on top of each other. ExoS names, PAINTED and contact labels move apart, on the hunt map and the after-action map.`,`TEST BED: “Crowded phone”. Three contacts and the uplink sit near the right edge. Find and tap each one.`,`NEW (r24-s1): long-press anything to see what it is. Hold a finger on a button, a HUD word, a contact, a tag, a mark or the ground. On a computer, right-click it.`,`The explain card opens at the top left. Any tap closes it. A long-press never fires the button or sets a move.`,`NEW: a greyed button says why when you tap it. Example: FIRE · NO SIGHT, then “No line of sight. Move until the contact is in view.”`,`NEW: the greyed button shows its reason in words: NO SIGHT, NO LOCK, OUT OF RANGE, HEARD ONLY, LEG DAMAGED, NEED AP.`,`NEW: low hits. A hit ExoS with `+n.WARN_HITS_LEFT+` CORE hits or fewer left gets a red ring and “! N” on the map. The HUD says “A: 2 CORE hits left”.`,`NEW: LAST SEEN. A contact that drops off your picture leaves a faded mark with its round, for `+n.LASTKNOWN_ROUNDS+` rounds. You can’t target it.`,`NEW: GAMEPLAY BASICS reads from the glossary, by screen. BACK is at the top too.`,`One name per thing: ExoS (not mech), NORMAL (not NORM), the part names MAST, ARMS, CORE, BACK and LEGS, ESM (not passive ears), SCAN (the tag that was SHIP).`,`FIXED: a tap on empty ground or on your own ExoS clears the selected contact. A greyed NORMAL or SPRINT no longer traps a lame ExoS. The objective line says which ExoS its distance is from.`,`TEST BED: “Read it cold”. One hunt turn with a blocked FIRE, a lame ExoS, one low on hits, an UNKNOWN ESM contact and a LAST SEEN mark.`],round:24,howTo:`Play “Read it cold” and “Crowded phone” first. Long-press everything you don’t know, then tap each greyed button. Then play a contract or two and tap the answers after each hunt. When you finish, tap SEND LOG and send it to Jamie.`};``+n.DROP_ZONES,``+n.RWR_BEARING_ERR+n.RWR_LIFE,``+n.RWR_LIFE,``+n.IR_FIRE+n.IR_SPRINT+n.IR_COOL_PER_TURN,``+n.OVERLOAD_EN_PER_TILE,``+n.FACE_WAYPOINTS_MAX,``+n.HIT_COVER_LOW+n.HIT_COVER;var Th=[{round:23,title:`Round 23: Who you’ll anger`,lines:[`THE CITY (CONTRACTS tab): Corporate, Foundry and Syndicate hold the districts. ▼ SHIP shows where you are. The three jobs are in districts. Fuel = the links you jump. The faction that holds the ship’s district sets the fuel price.`,`FACTION JOB (×`+n.CITY_FACTION_PAY+`): a rival of the target hires you. The employer likes you more, and the target likes you less. BROKER JOB (×`+n.CITY_BROKER_PAY+`): the job is deniable. Only the target notices.`,`STANDING: one bar per faction. HATED (≤ `+n.STANDING_HATED+`): danger +1 step, +`+Math.round(n.STANDING_HATED_ALERT*100)+`% of their field awake, fuel costs more. LIKED (≥ +`+n.STANDING_LIKED+`): their jobs pay more, a FREE SCAN against their enemies, fuel costs less. Standing fades `+n.STANDING_DRIFT+` a contract.`,`Factions are RIVALS, NEUTRAL or ALLIES with each other. Each city rolls this. Every standing change spills onto the other factions.`]},{round:22,title:`Round 22: What happened`,lines:[`After every hunt, the AFTER-ACTION PAGE opens. WHAT HAPPENED lists up to `+n.AAR_MAX_MOMENTS+` turning points: who found whom, hits that mattered, how the job swung, and the end.`,`WHAT IT COST lists people, repairs, pay, salvage and the books. “← T7” = the turning point behind that line. Tap a turning point to see it on the map as it was at that turn. DETAILS keeps the old panels.`,`HELD THE FIELD (job done): you see the whole story, and your downed ExoS come home (rebuild at half cost). FIELD LOST: the enemy side shows as ??? with a rough direction, and the wrecks stay out there.`,`The books: every job pays ×`+n.PAY_MULT+`. A completed contract adds a `+n.CONTRACT_BONUS+` cr bonus. A new company starts with `+n.START_FUEL+` fuel.`]},{round:21,title:`Round 21: The company`,lines:[`The game opens on your COMPANY, and it saves the company on this phone. Named operators have one skill each (STEADY AIM, QUIET MOVER, SHARP EARS, SENSOR TECH). They earn XP and level up.`,`When an ExoS goes down, its operator is CRITICAL. Carry them out, and they are benched for a while. Leave them, and they are KIA, on the MEMORIAL. Recruits come between contracts.`,`The roster: 3 ExoS, each with its own fit and damage. You keep them from hunt to hunt and from contract to contract. Before every hunt, pick a lance of 1 to 3.`,`The books: three contract offers (danger, 2 to 4 hunts, a fee on completion, fuel to get there). You pay wages and ship upkeep when a contract ends. The company can be in debt once. After that, it folds.`,`Repairs and rebuilds use parts (salvaged from kills, or bought). The MARKET sells parts, fuel, items, an ExoS now and then, and recruits. The hangar fits only what you own.`,`The ship: 7 hardpoints for modules (sensor boosts, quiet drop rig, ExoS bay, repair bay, medbay, salvage hold, fuel tanks, hull armour, berths and more). A painted ship may take a hull hit.`]},{round:20,title:`Round 20: Eyes from the ship`,lines:[`The ship’s scan is live: START CLOCK / PAUSE, with no time cap. RADAR = where. It pings everything, even silent units, outlines zones and opens the north and south drop zones.`,`THERMAL = what’s alive: zone types, warm units and their size. EM LISTEN = who. It hears only transmitters: first a count, then a fix and the CARD’s best guess.`,`Run any mix of sensors at once. Each sensor has its own ring (drag near a ring to move it), or use FULL MAP. Three bars on a contact show how hard each sensor looked.`,`ALT HIGH / MID / LOW. HIGH: big, weak, fuzzy rings, and quiet. LOW: small, strong, sharp rings (thermal most), and loud.`,`The RISK meter climbs while sensors are on and cools with them all off. A new step may add enemy units. The step you drop at wakes part of the field. From step 2, it may paint the ship.`,`Patrols walk, and new patrols arrive while you wait. Some jobs have a SCAN WINDOW. The job card shows it first.`,`After the hunt, THE SCAN on the result screen gives one line per stretch of your scan (set-up, minutes, what came back, risk added). It also shows what the drop rolled. SEND LOG sends these as [SCAN] lines.`]},{round:19,title:`Round 19: Listen before you land`,lines:[`After you pick a job, the ship can LISTEN: SKIP / SHORT / MEDIUM / LONG. SHORT = the roster and zone outlines. MEDIUM = zone types and a choice of 3 drop zones. LONG = blips for everything that emits, with the CARD’s best guess.`,`Blips start the hunt as stale SHIP contacts. You only know the zones through the scan.`,`Listening has costs. At any level: extra enemy units. MEDIUM and up: part of the field is awake, with a rough fix on your drop zone. LONG: maybe a painted ship, with 2 patrols waiting near your drop zone. The dial shows the risk. The result screen shows what happened.`,`The game builds hunt 1 after its scan. The fits then lock for the contract.`,`Every ExoS knows when a radar paints it (a red PAINTED ring). The RWR module adds the readout: range rings, a spoke to the radar, search vs lock and a best-guess ID. When you move, a wedge swings to where the radar must be.`,`Text on phones is bigger. Menus scroll instead of shrinking. The game never scales below 85%.`]},{round:18,title:`Round 18: Fit for the job`,lines:[`The HANGAR is the loadout screen. Tap a part of the ExoS, then tap a hardpoint to fit something to it. Start from Scout (Wisp), Line (Warden) or Brawler (Bulwark).`,`Weight: over the rated load, every move is louder and costs more Energy per tile (CREEP too). Far over it, each move costs +1 AP. Power = reactor output − draw. Batteries add to the pool.`,`Each location is a part. When you lose a part, its modules go offline. Only shots from behind hit the BACK.`,`THERMAL: heat comes from the reactor, the frame’s size, firing and sprinting. Turrets carry IR sights. Thermal optics lets you read heat. A sniper turret hits targets up to 20 tiles away.`,`Contacts carry stacked sense tags (EO, RDR, ESM, IR, ACO, MZL), each with the ExoS that made it. Gold = the tag that holds the fix. ESM sits on the best fit of your bearing lines. A noise zone only widens it. Cover shows as a shield.`,`INTEL lists what the field listens on. The result screen says what found you first. PLAY SEED replays a hunt. QUIT goes back to the hangar. The game scales to its window.`]},{round:17,title:`Round 17: Eyes on the street`,lines:[`Drag from your ExoS to draw your move freehand. The line goes round walls. If you draw through scrap, the move crosses it (on purpose). Cyan = this turn’s AP. Red dashed = past it.`,`Drag the end handle to extend the line, or drag the middle to redraw from there. Tap-to-move still works.`,`Aim your eyes as you walk. Tap a point on your line. Then tap where the ExoS should look. Drag the eye marker to move it. You can place up to 3 per move. Turning is free now.`,`Your eyes work on every step. Anything new stops the move on that tile ("CONTACT — move stopped"). You keep the AP you didn’t spend.`,`Scrap and rubble are low cover (−15%). Walls are −25%. When you aim at a target in cover, the game outlines the piece that gives the cover.`]},{round:16,title:`Round 16: Rolled ground`,lines:[`Every hunt is a new district. The game packs it from irregular city pieces (half blocks, strips, L shapes, hand-drawn blocks) and cuts it at the map edge. The job card gives its size. Bigger districts have a bigger field.`,`Brown speckled scrap and rubble: slow (2 tiles of movement a tile), loud (+3 sound), low cover. Rusty walls are set pieces and street barricades. You can weave through a chicane, but you cannot see past it.`,`You start in a cleared staging area. Hover over anything on the map, or hold a finger on it, to see what it is. Cover that you share with your target (you both stand against it) does not count.`,`ESCORT: up to three routes per fork (NORTH / AHEAD / SOUTH), and ROUTE buttons to set forks ahead. A ring shows where the next move ends. You can give HOLD and HURRY orders. The transport is in the turn strip.`,`Every ExoS leaves on its own: walk into the green zone and tap EXTRACT. The hunt ends when all your living ExoS are out.`]},{round:15,title:`Round 15: Pick your fights`,lines:[`Jobs come in four types, shown at the top of each job card: UPLINK (stand in the ring and tap UPLINK), BOUNTY, RETRIEVE and ESCORT.`,`BOUNTY: every kill pays that enemy’s bounty (prices on the CARD). Reach the quota to win, then tap EXTRACT when you choose. The field has extra enemies.`,`RETRIEVE: PICK UP the guarded cargo. This alerts the whole field, and the field hunts the carrier. The carrier cannot SPRINT. HAND OFF to the other ExoS. Carry the cargo out the right edge.`,`ESCORT: a friendly transport walks from the left edge to the right edge. Keep it alive. At each fork, it waits for you to tap a route on the map.`]},{round:14,title:`Round 14: Read the signature`,lines:[`Every enemy is one of 9 variants (3 patrols, 3 turrets, 3 emplacements). The variants fight differently.`,`Tap a contact to see what your sensors detected (EMIT, pulses, moved or still, steps or a shot heard). The CARD lists the 9 variants, each with one bold TELL. "3 fit" shows how many variants still match.`,`ID calls a contact. A call on a turret or emplacement freezes its track. A right call before your eyes see the contact adds +10% to hit.`,`The TEST BED (on the HANGAR screen) has short scenarios. Each one tests one thing.`]},{round:13,title:`Round 13: Loud gets company`,lines:[`You make noise in two ways. EMIT (orange) is electronic: radar, ECM and uplink. It grows, fades slowly and carries far.`,`SOUND (pale ring with ticks) comes from moving and shooting. It has one radius per turn, carries through walls, and is gone at your next turn. A contact that you only hear is a hollow SOUND square. It is never enough to shoot at.`,`Patrols carry radios (a small, steady EMIT), so passive sensors find them. Turrets stay silent.`,`Two legs: lose one, and you can only CREEP. Lose both, and you CREEP at half distance.`,`THE PACK (splash toggle): when one enemy senses you, it alerts others nearby. Patrols leave their posts to hunt you.`]},{round:12,title:`Round 12: Pick your shot`,lines:[`Shots roll to hit. FIRE shows your chance, and the yellow ODDS line shows why (range, target moved, cover, a loud target).`,`A hit strikes a part: CORE, LEGS, ARMS (weapon) or MAST (sensors). The same rules apply to the enemy. Part damage carries through the contract. REPAIR fixes the worst part first.`]}],Eh=[{k:`cold`,q:`Did you understand the hunt without needing to ask anyone?`,a:[`Yes`,`Mostly`,`No`,`Something else`]},{k:`why`,q:`When a button was greyed, did you know why?`,a:[`Yes, it said`,`Mostly`,`No`,`Didn’t notice`]},{k:`press`,q:`The long-press card was…`,a:[`Useful`,`Too long`,`Hard to open`,`Didn’t use it`]}],Dh=[{title:`The city and the company`,screens:[`city`,`company`],how:[`The game opens on your COMPANY. It saves on this phone.`,`CONTRACTS shows the city map. Tap a district to see its JOB, then tap TAKE IT.`,`Before every hunt, pick who drops in each ExoS. Tap the button next to it.`,`Between contracts, use the tabs: REFIT for repairs, MARKET to buy, SHIP for modules.`]},{title:`The ship’s scan`,screens:[`scan`],how:[`After you take a job, the ship scans the district before you drop.`,`Turn sensors on. Drag each ring onto what matters, or use FULL MAP.`,`Tap START CLOCK. Tap PAUSE to think. Time passes only while the clock runs.`,`Watch the RISK. When you are ready, pick a DROP ZONE and tap NEXT.`]},{title:`The hangar`,screens:[`hangar`],how:[`Tap a part of the ExoS, then tap a hardpoint to fit an item you own.`,`The readout shows LOAD, POWER and what you give off: EMIT, IR and SOUND.`,`The fits lock when you LAUNCH HUNT 1, until the contract ends.`]},{title:`The hunt`,screens:[`hunt`],how:[`Everyone acts in the ORDER strip, top right. On your ExoS’s turn, spend its AP.`,`To move, tap the map or drag from your ExoS. Pick CREEP, NORMAL or SPRINT. Then tap MOVE.`,`Tap a contact to select it. Then FIRE, ID or RADAR use it.`,`A greyed button says why on a tap. END TURN passes to the next unit.`,`On a phone the HUD is one line. Tap it to see all of it.`]},{title:`Contacts`,screens:[`contact`],how:[`Enemies are hidden. Your sensors fix them as contacts. The tags say which sensor fixed each one.`,`Gold is the tag that holds the fix now. The letters after a tag name the ExoS that sensed it.`]},{title:`Map marks`,screens:[`map`],how:[`Long-press any mark, ring, line or patch of ground to see what it is.`]},{title:`The CARD`,screens:[`card`],how:[`Open the CARD to compare what your sensors noted with each variant. Then tap ID to make your call.`]},{title:`After the hunt`,screens:[`after`],how:[`The after-action page opens after every hunt. WHAT HAPPENED lists the turning points.`,`Tap SAVE & NEXT to go on.`]}],Oh=[[`Camera`,`Drag the map to pan. Z+ and Z− zoom. CTR centres on the active ExoS.`],[`Debug`,`DEBUG: REROLL JOBS rolls new jobs for the same hunt. It is for testers, to get the job type they want.`]],kh={title:`LIVE TOY (Round 25)`,question:`Does live time with auto-pause make the hunt flow, and still feel like a plan?`,newThings:[`This is a separate test page. Your company here is not your company in the main game.`,`NEW (r25 live B): the game pauses by itself, and the yellow line says why. It pauses on a NEW CONTACT, when a loose track becomes a FIXED TRACK, when an ExoS starts TAKING FIRE, when an ExoS is IDLE, and when the OBJECTIVE changes.`,`A loose track that jumps about never pauses the game again. A contact pauses it again only when it becomes a FIXED TRACK, or comes back after `+n.AUTOPAUSE_RELOST+` s or more off your picture.`,`Switch each reason on or off on the start screen: PAUSE ON CONTACT, FIRE, IDLE and OBJECTIVE.`,`Enemies now act all the time, in short steps, and aim before they shoot, as you do.`,`NEW (r25 live A): one clock runs the hunt. Every ExoS and every enemy acts at the same time. There are no turns and no AP.`,`The hunt opens paused. Tap PLAY (bottom right) or the space bar to start the clock. Tap PAUSE to stop it at any time.`,`Every order works while paused: draw a route, set looks, FIRE, RADAR, UPLINK. Then tap PLAY and watch it happen.`,`Actions take time. A move takes as long as the walk. RADAR, UPLINK, PICK UP, HAND OFF, ECM and MORTAR each take a few seconds. A ring on the ExoS fills while it works.`,`A new order replaces what the ExoS is doing. A move you stop gives back the EN for the part it did not walk.`,`FIRE aims for `+n.LIVE_AIM_TIME+` s, then shoots. The gun then cools for `+n.LIVE_FIRE_COOLDOWN+` s. It keeps the target and fires again by itself while it can shoot. An ExoS can aim and walk at the same time.`,`EN comes back every second. EMIT falls every second. A SOUND lasts `+n.LIVE_ROUND_SEC+` s.`,`Tap a letter at the top right, or tap an ExoS on the map, to give that ExoS orders.`],round:25,howTo:`Play a few hunts here, then the same seed in the main game (PLAY SEED). Tap the answers after each hunt. When you finish, tap SEND LOG and send it to Jamie.`},Ah=[{k:`walk`,q:`Did the walks drag?`,a:[`No`,`A little`,`Yes`,`Something else`]},{k:`rush`,q:`Did you feel rushed, or need fast taps?`,a:[`Never`,`Once or twice`,`Often`,`Something else`]},{k:`plan`,q:`Did it feel like watching your plan play out?`,a:[`Yes`,`Partly`,`No`,`Something else`]}],jh=[`The hunt opens paused. PLAY starts the clock. PAUSE stops it. The space bar does both.`,`The game also pauses by itself when something needs a decision. The yellow line says why. Then tap PLAY.`,`Everyone acts at the same time. Tap a letter at the top right, or an ExoS on the map, to pick it.`,`To move, tap the map or drag from your ExoS. Pick CREEP, NORMAL or SPRINT. Then tap MOVE.`,`Actions take time. A ring fills on the ExoS while it works. A new order replaces the old one.`,`Tap a contact to select it. FIRE aims, shoots, then the gun cools down. It keeps firing at that target while it can.`];if(n.TIME_MODE===`live`){Object.assign(wh,kh),Eh.splice(0,Eh.length,...Ah);let e=Dh.find(e=>e.title===`The hunt`);e&&(e.how=jh)}function Mh(){let e=e=>`<div class="bst"><b>`+Fh(e.name)+`</b>: `+Fh(e.line)+`</div>`;return`<p><b>Long-press anything to see what it is.</b> On a computer, right-click it. A tap on a greyed button says why it is greyed.</p>`+Dh.map(t=>`<h4>`+Fh(t.title)+`</h4>`+t.how.map(e=>`<p>`+Fh(e)+`</p>`).join(``)+hp.filter(e=>t.screens.includes(e.screen)).map(e).join(``)).join(``)+`<h4>More</h4>`+Oh.map(([e,t])=>`<p><b>`+e+`:</b> `+Fh(t)+`</p>`).join(``)}var Nh=`<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;font:bold 12px monospace" aria-label="Map legend">
