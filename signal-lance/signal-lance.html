<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Signal Lance">
<meta name="theme-color" content="#1b1c1e">
<link rel="manifest" href="manifest.webmanifest">
<title>Signal Lance</title>
<script>/* Not inside the Claude viewer (e.g. GitHub Pages / home-screen app): no title bar to dodge. */
try{if(window.self===window.top)document.documentElement.style.setProperty('--top','0px')}catch(e){}</script>
<style>
/* --top: strip kept clear because the Claude app's artifact viewer overlays its title bar there. */
/* Single dark look on purpose: grey primitives, colour only for information. */
:root{--top:56px;--bg:#1b1c1e;--fg:#d8d8d8;--btn:#3a3b3e;--btnOn:#6a7684;--line:#666;color-scheme:dark}
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font:13px monospace}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.col{position:fixed;display:flex;flex-direction:column;gap:6px;z-index:2}
#rcol{right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#lcol{left:calc(6px + env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px))}
#bDbg{position:fixed;left:calc(4px + env(safe-area-inset-left,0px));bottom:calc(2px + env(safe-area-inset-bottom,0px));min-width:40px;min-height:26px;font-size:10px;padding:0 4px;z-index:2;opacity:.6}
button{min-width:60px;min-height:52px;font:bold 13px monospace;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;touch-action:manipulation;padding:0 8px}
button.on{background:var(--btnOn)}
#tip{position:fixed;z-index:4;max-width:min(320px,80vw);background:rgba(20,22,26,.94);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:12px/1.4 monospace;pointer-events:none;white-space:normal}
#hud{white-space:nowrap;font-size:13px;position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));z-index:2;pointer-events:none;line-height:1.5;text-shadow:0 0 3px #000}
#pbar{display:inline-block;width:80px;height:8px;border:1px solid var(--fg);vertical-align:middle}
#pfill{height:100%;background:var(--fg)}
.panel{position:fixed;inset:0;z-index:5;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(var(--top) + 4px) calc(16px + env(safe-area-inset-right,0px)) 12px calc(16px + env(safe-area-inset-left,0px));text-align:center;overflow-y:auto;touch-action:pan-y}
#load{flex-direction:row;align-items:flex-start;justify-content:flex-start;text-align:left;gap:16px}
#mods{flex:1.3;min-width:0;display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:8px}
.zrow{display:flex;gap:6px}
.mname{flex:1;min-width:0;line-height:1.25}
.mname small{opacity:.75;display:block;font-size:11px;line-height:1.3;white-space:normal}
.pm{min-width:52px;min-height:48px;font-size:22px}
#lside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
#slots{font-size:16px;font-weight:bold}
#intel{font-size:14px;font-weight:bold;line-height:1.35;border-left:3px solid var(--btnOn);padding-left:8px}
#bLaunch{min-height:64px;font-size:20px;background:var(--btnOn)}
#logv{white-space:pre-wrap;font-size:11px;opacity:.8;word-break:break-word}
#logta{width:100%;font:11px monospace;background:var(--btn);color:var(--fg)}
#note{width:min(520px,100%);min-height:48px;font:16px monospace;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 10px;box-sizing:border-box}
#resWhy{max-width:600px}
#brow{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:2}
#bMove{min-width:84px;background:var(--btnOn)}
#bUp{min-width:84px;border-color:#fc3}
#bMortar{border-color:#e85}
#rcol .zrow button{flex:1}
#bEnd{min-height:64px;font-size:16px;background:var(--btnOn)}
button small{font-size:10px;font-weight:normal;opacity:.85}
button.lockd{opacity:.35}
#ap{letter-spacing:2px;font-size:15px}
#ver{position:fixed;left:calc(50px + env(safe-area-inset-left,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));z-index:2;font-size:10px;opacity:.55;pointer-events:none}
#init{position:fixed;top:calc(var(--top) + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:2;pointer-events:none;font:bold 14px monospace;text-shadow:0 0 3px #000;display:flex;gap:4px}
#init span{min-width:22px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;text-align:center;background:rgba(0,0,0,.45)}
#init span.me{border-color:#9cf;color:#9cf}
#init span.now{background:var(--btnOn);color:#fff}
#init span.done{opacity:.4}
#lver{font-size:11px;opacity:.6}
#jobs,#cres{justify-content:flex-start}
.jrow{display:flex;gap:12px;width:100%;max-width:900px;align-items:stretch}
.job,.hunt{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);border-radius:6px;padding:8px}
.jintel{flex:1;font-size:13px;line-height:1.35;border-left:3px solid var(--btnOn);padding-left:8px}
.jtake,#bNewC{min-height:56px;font-size:17px;background:var(--btnOn)}
#jlance{font-size:14px;line-height:1.5}
#jlance b.lost{color:#e66}
#jlance>div{margin-bottom:6px}
.rfrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:4px}
button.rf{min-width:84px;min-height:48px;font-size:12px;line-height:1.2}
.cap{opacity:.7;font-size:11px}
.hunt{font-size:12px;line-height:1.4}
#splash,#basics{z-index:7}
#res{justify-content:flex-start}
.doc{justify-content:flex-start;text-align:left}
.dtitle{font-size:20px;font-weight:bold;width:100%;max-width:760px}
.dtext{width:100%;max-width:760px;font-size:14px;line-height:1.45}
.dtext p{margin:0 0 8px}.dtext ul{margin:0 0 8px;padding-left:20px}
.drow{display:flex;gap:16px;width:100%;max-width:900px;align-items:flex-start}
.drow .dtext{flex:1.4}.dart{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
button.go{background:var(--btnOn);min-width:140px;font-size:16px}
#tester{width:min(320px,100%);min-height:48px;font:16px monospace;background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:0 10px;box-sizing:border-box}
#resQ{display:flex;flex-direction:column;gap:6px;width:100%;max-width:760px}
.qrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qrow span{min-width:100%;text-align:left;font-weight:bold}
button.qa{min-height:48px;min-width:0;font-size:13px}
.tbrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.tbrow div{flex:1;min-width:0}.tbrow small{display:block;opacity:.8;font-size:12px;line-height:1.3}
#tbQ{display:flex;flex-direction:column;gap:6px;width:100%;max-width:760px}
#tbTxt{max-width:700px}
#card,#idp{z-index:6;gap:6px;justify-content:flex-start;padding-top:calc(var(--top) + 2px)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px;width:100%;max-width:900px;text-align:left}
.cgrid h4{margin:0;font-size:12px;opacity:.7;letter-spacing:1px}
.cv{border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:11px;line-height:1.22}
.cv b.n{font-size:13px;color:#fff}.cv .t{color:#ffd27a;font-weight:bold}.cv .f{opacity:.7}
button.idv{min-height:48px;text-align:left;font-size:13px;line-height:1.2;padding:3px 8px}
button.idv small{display:block}
button.idv.out{opacity:.35}button.idv.out b{text-decoration:line-through}
.idhead{font-size:13px;max-width:900px;line-height:1.35}
[hidden]{display:none!important}
#rot{position:fixed;inset:0;z-index:9;padding-top:var(--top);background:var(--bg);display:none;align-items:center;justify-content:center;font-size:20px}
@media (orientation:portrait){#rot{display:flex}}
</style>

<canvas id="cv"></canvas>
<div id="tip" hidden></div>
<div id="hud"></div>
<div id="init"></div>
<div id="rcol" class="col">
  <button id="bRadar">RADAR</button>
  <button id="bEcm">ECM</button>
  <button id="bGhost">GHOST</button>
  <div class="zrow"><button id="bMortar">MORTAR</button><button id="bFire">FIRE</button></div>
  <button id="bEnd">END TURN</button>
</div>
<div id="lcol" class="col">
  <div class="zrow"><button id="bCard">CARD</button><button id="bId">ID</button></div>
  <div class="zrow"><button id="bZin">Z+</button><button id="bZout">Z−</button></div>
  <button id="bCtr">CTR</button>
</div>
<div id="brow">
  <button id="bCreep">CREEP</button>
  <button id="bNorm">NORM</button>
  <button id="bSprint">SPRINT</button>
  <button id="bMove">MOVE</button>
  <button id="bUp">UPLINK</button>
</div>
<button id="bDbg">DBG</button>
<div id="ver"></div>
<div id="load" class="panel" hidden>
  <div id="mods"></div>
  <div id="lside">
    <div class="zrow" style="align-items:center"><button id="bLA">MECH A</button><button id="bLB">MECH B</button><div id="slots"></div></div>
    <div id="lver"></div>
    <div id="intel"></div>
    <div class="zrow"><button id="bQuick">LENGTH: 3 HUNTS</button><button id="bTB">TEST BED</button></div>
    <button id="bLaunch">START CONTRACT</button>
    <div id="logv"></div>
    <div class="zrow"><button id="bSend">SEND LOG</button><button id="bCopy">COPY LOG</button><button id="bHelp">BASICS</button></div>
    <textarea id="logta" rows="4" readonly hidden></textarea>
  </div>
</div>
<div id="res" class="panel" hidden>
  <div id="resTxt" style="font-size:18px;font-weight:bold"></div>
  <div id="resWhy"></div>
  <div id="resQ"></div>
  <input id="note" type="text" maxlength="200" placeholder="Note: what turned it / what felt flat?" autocomplete="off">
  <button id="bSave">SAVE &amp; NEXT</button>
</div>
<div id="jobs" class="panel" hidden>
  <div id="jhead" style="font-size:18px;font-weight:bold"></div>
  <div id="jlance"></div>
  <div class="jrow">
    <div class="job"><div id="j0" class="jintel"></div><button id="bJ0" class="jtake">TAKE JOB 1</button></div>
    <div class="job"><div id="j1" class="jintel"></div><button id="bJ1" class="jtake">TAKE JOB 2</button></div>
  </div>
  <button id="bReroll" style="opacity:.7;font-size:11px;min-height:40px">DEBUG: REROLL JOBS</button>
</div>
<div id="cres" class="panel" hidden>
  <div id="cTitle" style="font-size:24px;font-weight:bold"></div>
  <div id="cSub"></div>
  <div id="cHunts" class="jrow"></div>
  <div class="zrow"><button id="bSend2">SEND LOG</button><button id="bNewC">NEW CONTRACT</button></div>
</div>
<div id="tb" class="panel doc" hidden>
  <div class="dtitle">TEST BED <small style="font-size:12px;opacity:.7">· one mechanic, one hunt · no pay, no carry-over</small></div>
  <div id="tbList" class="dtext"></div>
  <div class="zrow"><button id="bTBCard">CARD</button><button id="bTBBack" class="go">BACK</button></div>
</div>
<div id="tbres" class="panel" hidden>
  <div id="tbTitle" style="font-size:18px;font-weight:bold"></div>
  <div id="tbTxt"></div>
  <div id="tbQ"></div>
  <div class="zrow"><button id="bTBRetry" class="go">RETRY</button><button id="bTBDone">BACK</button></div>
</div>
<div id="card" class="panel" hidden>
  <div id="cardGrid" class="cgrid"></div>
  <button id="bCardX" class="go">CLOSE</button>
</div>
<div id="idp" class="panel" hidden>
  <div id="idHead" class="idhead"></div>
  <div id="idGrid" class="cgrid"></div>
  <div class="zrow"><button id="bIdClear">NO ID</button><button id="bIdCard">CARD</button><button id="bIdX" class="go">CANCEL</button></div>
</div>
<div id="splash" class="panel doc">
  <div id="spTitle" class="dtitle"></div>
  <div id="spBody" class="dtext"></div>
  <input id="tester" type="text" maxlength="30" placeholder="Your name (for the log)" autocomplete="off">
  <div class="zrow"><button id="bPack">THE PACK: OFF</button><button id="bMap">MAP: NEW DISTRICTS</button></div>
  <div class="zrow"><button id="bBasics">GAMEPLAY BASICS</button><button id="bCont" class="go">CONTINUE</button></div>
</div>
<div id="basics" class="panel doc" hidden>
  <div class="dtitle">Gameplay basics</div>
  <div class="drow"><div id="bsText" class="dtext"></div><div id="bsArt" class="dart"></div></div>
  <button id="bBack" class="go">BACK</button>
</div>
<div id="rot">Rotate your phone</div>
<script type="module" src="/src/main.ts"></script>
