  <div id="hangar">
    <div class="zrow" id="hsuits"></div>
    <div class="zrow" id="htpl"></div>
    <div id="hframe"></div>
    <div id="hbody"><div id="hsuit"></div><div id="hside"><div id="hloc"></div><div id="hread"></div></div></div>
  </div>
  <div id="lside">
    <div id="lpre" hidden><div id="pintel"></div><button id="bPreGo">LAUNCH HUNT 1</button><button id="bPreBack">BACK TO THE SCAN</button></div>
    <div id="lnorm" style="display:contents">
    <div id="lver"></div>
    <div id="intel"></div>
    <div class="zrow"><button id="bQuick">LENGTH: 3 HUNTS</button><button id="bTB">TEST BED</button></div>
    <div class="zrow" id="seedRow"><input id="seedIn" type="text" placeholder="seed, or paste a log line" autocomplete="off"><button id="bSeed">PLAY SEED</button></div>
    <button id="bLaunch">START CONTRACT</button>
    <div id="logv"></div>
    <div class="zrow"><button id="bSend">SEND LOG</button><button id="bCopy">COPY LOG</button><button id="bHelp">BASICS</button></div>
    <textarea id="logta" rows="4" readonly hidden></textarea>
    </div>
  </div>
</div>
<div id="scan" class="panel" hidden>
  <div id="smap"><div id="sHead"></div><canvas id="scv"></canvas></div>
  <div id="sside">
    <div id="sDialBox"><div><b>THE SHIP LISTENS</b> <small style="opacity:.7">· longer = more intel</small></div>
    <div class="zrow" id="sDial"></div>
    <div id="sWhat"></div>
    <button id="bListen">LISTEN</button></div>
    <div id="sLive" hidden><div class="zrow"><div class="zrow" id="sSens"></div><button id="bWide">FULL MAP</button></div></div>
    <div class="zrow" id="sAlt" hidden></div>
    <div class="zrow"><button id="bRun" hidden>START</button><button id="bScanCard">CARD</button><button id="bScanGo">NEXT</button></div>
    <div class="zrow" id="sDrops"></div>
    <div id="sClock" hidden></div><div id="sRisk" hidden></div>
    <div id="sIntel"></div>
    <div id="sHelp" hidden></div>
  </div>
</div>
<div id="hsheet" class="sheet" hidden><div id="hsbox"><div id="hshead"><span id="hstitle"></span><button id="hsclose">CLOSE</button></div><div id="hopts"></div></div></div>
<div id="res" class="panel" hidden>
  <div id="resTxt"></div>
  <div id="aarCols">
    <div id="aarWhat"><div class="aarh">WHAT HAPPENED <small>tap one: it shows on the map</small></div><div id="aarList"></div></div>
    <div id="aarCost"><div class="aarh">WHAT IT COST</div><div id="aarCostList"></div></div>
  </div>
  <button id="bDet">DETAILS ▸</button>
  <div id="resWhy" hidden></div>
  <div id="resQ"></div>
  <div id="resTbQ" hidden></div>
  <input id="note" type="text" maxlength="200" placeholder="Note: what turned it / what felt flat?" autocomplete="off">
  <div class="zrow" id="resGo"><button id="bSave">SAVE &amp; NEXT</button></div>
  <div class="zrow" id="resTb" hidden><button id="bAarRetry" class="go">RETRY</button><button id="bAarDone">BACK</button></div>
</div>
<div id="jobs" class="panel" hidden>
  <div id="jhead" style="font-size:18px;font-weight:bold"></div>
  <div id="jlance"></div>
  <div class="jrow">
    <div class="job"><div id="j0" class="jintel"></div><button id="bJ0" class="jtake">TAKE JOB 1</button></div>
    <div class="job"><div id="j1" class="jintel"></div><button id="bJ1" class="jtake">TAKE JOB 2</button></div>
  </div>
  <button id="bReroll" style="opacity:.7;font-size:11px;min-height:40px">DEBUG: REROLL JOBS</button>
</div>
<div id="cres" class="panel" hidden>
  <div id="cTitle" style="font-size:24px;font-weight:bold"></div>
  <div id="cSub"></div>

</div>
<div id="co" class="panel" hidden>
  <div id="coHead" style="font-size:16px;font-weight:bold"></div>

  <div id="coBody"></div>
  <div class="zrow" id="coFoot"><button id="bCoGo" class="go">START CONTRACT</button><button id="bCoTools">HANGAR · TOOLS</button><button id="bCoNew">NEW COMPANY</button></div>
</div>
<div id="tb" class="panel doc" hidden>

  <div id="tbList" class="dtext"></div>
  <div class="zrow"><button id="bTBCard">CARD</button><button id="bTBBack" class="go">BACK</button></div>
</div>
<div id="tbres" class="panel" hidden>
  <div id="tbTitle" style="font-size:18px;font-weight:bold"></div>
  <div id="tbTxt"></div>

  <div class="zrow"><button id="bTBRetry" class="go">RETRY</button><button id="bTBDone">BACK</button></div>
</div>

</div>

</div>

  <button id="bBack" class="go">BACK</button>
</div>
