aves on its own. Walk into the green extraction zone, then tap EXTRACT (no AP) to take that mech off the map. The hunt ends once all your living mechs are out: Escort wins if the transport walked out, Retrieve if the carrier extracted with the cargo, Bounty at quota. An uplink or a cleared field still wins at once.`,`NEW (r16-s7): cover you share does not count. If you stand right up against the same wall, barricade or scrap that covers your target, you lean round it: no cover penalty. Same rule for enemies.`,`NEW (r16-s7): Escort levers. Route buttons now show at every fork ahead: tap one to set that fork in advance (lit with a ✓; tap again to clear). Reaching a set fork, the transport carries straight on, even mid-move. An unset fork still stops it until you choose.`,`NEW (r16-s7): a dashed gold ring marks where the transport's next move will end ("waits at fork" if a lever isn't set). The transport is now in the turn strip (green T).`,`NEW (r16-s6): you start in a cleared staging area on the most open stretch of the left edge, and the Escort transport starts beside you.`,`NEW (r16-s6): Escort orders (bottom row, your turn, no AP): HOLD = the transport waits one round, then carries on (`+e.ESCORT_HOLDS+` per hunt). HURRY = its next move is a sprint, `+e.ESCORT_SPRINT+` tiles instead of `+e.ESCORT_MOVE+`, and louder (`+e.ESCORT_HURRIES+` per hunt). Tap again to cancel.`,`NEW (r16-s5): districts are no longer a grid of blocks. They are packed from irregular pieces (half blocks, long strips, L shapes, and the hand-drawn blocks), cut off at the map edge. Streets jog, narrow, close and dead-end; some pieces are small open lots or have courtyards.`,`NEW (r16-s3): the streets between blocks are no longer a clean grid. Some stretches have rubble across them (slow, loud), some are shut by a barricade, and some have a chicane: walls on alternate lanes you can weave through but can’t see straight past.`,`NEW (r16-s3): hover the mouse over anything on the map, or hold a finge  things. EMIT (orange) is electronic: radar, ECM and uplink. It builds up, fades slowly and carries far.`,`SOUND (pale ring with ticks) is moving and shooting. One radius per turn, heard through walls, gone at your next turn. A heard-only contact is a hollow SOUND square: never enough to shoot.`,`Patrols carry radios (a small steady EMIT), so passive sensors find them. Turrets stay silent.`,`Two legs: lose one and you can only CREEP; lose both and you creep at half distance.`,`THE PACK (splash toggle): one enemy that senses you alerts others nearby, and patrols leave their posts to hunt you.`]},{round:12,title:`Round 12: Pick your shot`,lines:[`Shots roll to hit: FIRE shows your chance and the yellow ODDS line shows why (range, target moved, cover, a loud target).`,`A hit strikes a part: core, legs, weapon or sensors. Same rules for the enemy. Part damage carries through the contract; REPAIR fixes the worst part first.`]}],Ia=[{k:`map`,q:`This district…`,a:[`Changed my plan`,`Didn't change it`,`Not sure`]},{k:`clutter`,q:`Scrap and rubble…`,a:[`Crossed it on purpose`,`Went round it`,`Never in my way`,`Heard an enemy crunch`]},{k:`move`,q:`Tap-to-move…`,a:[`Did what I wanted`,`Took clutter I’d avoid`,`Walked a line I didn’t want`,`Couldn’t look down a street`]}],La=[[`Goal`,`Each job has a type (top of the job card). UPLINK: stand in the gold ring and tap UPLINK on 3 turns, or destroy every enemy. BOUNTY: kills pay their bounty (prices on the CARD); reach the quota for a win, then extract at the right edge when you choose. RETRIEVE: PICK UP the cargo (the whole field then hunts the carrier, who can’t sprint), HAND OFF if needed, carry it out the right edge. ESCORT: keep the transport alive from the left edge to the right; at each fork, tap a route on the map (NORTH, AHEAD or SOUTH, where the streets are open). You can set the route at forks ahead of time (lit ✓); an unset fork stops it. HOLD makes it wait a round; HURRY makes it sprint its next move (3 of each per hunt). The gold dashed ring shows where its next move ends; T in the turn strip is its turn. To leave, walk into the green zone on the right and tap EXTRACT, mech by mech; the hunt ends when all your living mechs are out. Lose if both mechs are destroyed.`],[`Turns`,`Everyone acts in initiative order (strip, top right). On your mech's turn you spend AP (the ● pips). END TURN passes to the next unit.`],[`Move`,`Tap the map to plot a path. Pick CREEP, NORM or SPRINT, then tap MOVE. Faster covers more ground but is louder.`],[`Find`,`Enemies are hidden. A contact is a red square with a circle: the circle is how unsure you are. Passive sensors draw cyan bearing lines; two crossing lines make a fix. RADAR gives a sharp fix but is very loud.`],[`Fight`,`Tap a contact to select it. FIRE needs a tight fix, range and line of sight; the button says why if it's blocked, or shows your hit chance. Hits strike a part (core, legs, weapon, sensors). Cover (a wall or scrap close to the target) costs −25%, unless you are right up against the same piece of cover yourself. MORTAR fires on a fix with no line of sight, but scatters more on a fuzzy one.`],[`Noise`,`Two kinds. EMIT (orange bar, orange dashed ring) is electronic: radar, ECM and uplink add to it, it fades a little each turn, and passive sensors pick it up from far away. SOUND (pale ring with ticks) is moving and shooting: one radius per turn (the loudest thing you did), heard through walls, gone at your next turn.`],[`Ground`,`Every hunt is a new district (the job card gives its size), packed from irregular city pieces, so streets jog, narrow and dead-end. Blue dotted areas are quiet ground: you are harder to hear there. Amber hatched areas are noise: fixes on anything inside are blurry. Brown speckled scrap is slow (2 tiles of movement a tile) and loud (+3 sound), but it is low cover. Rusty outlined shapes are walls: set pieces in the blocks, and barricades that shut a street. A chicane (walls on alternate lanes) can be weaved through but not seen past.`],[`ID`,`Enemies come in 9 variants. Tap a contact to see what your sensors have picked up about it, open the CARD to compare, then tap ID to call it. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`],[`ECM`,`ECM masks you each turn it is on. GHOST places a fake contact for enemies.`],[`Camera`,`Drag to pan. Z+ / Z− zoom. CTR recentres.`],[`Look`,`Hover the mouse over anything on the map, or hold a finger on it, to see what it is and what it does.`],[`Debug`,`DEBUG: REROLL JOBS (job screen) rolls two new jobs for the same hunt, e.g. to get the job type you want to test. The log line notes it.`]],Ra=`<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;font:bold 12px monospace" aria-label="Map legend">
