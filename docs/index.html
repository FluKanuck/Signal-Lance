ict sets the fuel price.`,`STANDING: one bar per faction along the top, from `+n.STANDING_MIN+` to +`+n.STANDING_MAX+`.`,`HATED at `+n.STANDING_HATED+` or below: their jobs are one danger step higher. `+Math.round(n.STANDING_HATED_ALERT*100)+`% more of their field is awake when you drop. Their fuel costs ×`+n.STANDING_HATED_FUEL_MULT+`.`,`LIKED at +`+n.STANDING_LIKED+`: their own jobs pay ×`+n.STANDING_LIKED_PAY+`. Jobs against their enemies come with free intel (the scan opens with radar band 1 on the whole map). Their fuel costs ×`+n.STANDING_LIKED_FUEL_MULT+`.`,`Every contract, all standing fades `+n.STANDING_DRIFT+` toward 0, so a grudge can disappear. Only a completed job moves standing.`,`WHAT IT COST lists the standing changes at the end of a contract. SEND LOG also sends [CITY] lines (jumps, the job you picked, standing, fuel prices).`,`TEST BED: “Hated” and “Liked” play the same job against the Foundry. In “Hated”, the Foundry hates you. In “Liked”, a Corporate side that likes you posts the job. TAKE IT opens its scan.`],round:23,howTo:`Play Hated, then Liked, and look at what changed. Then play a contract or two: pick a job on the city map and tap the answers after each hunt. When you finish, tap SEND LOG and send it to Jamie.`};``+n.DROP_ZONES,``+n.RWR_BEARING_ERR+n.RWR_LIFE,``+n.RWR_LIFE,``+n.IR_FIRE+n.IR_SPRINT+n.IR_COOL_PER_TURN,``+n.OVERLOAD_EN_PER_TILE,``+n.FACE_WAYPOINTS_MAX,``+n.HIT_COVER_LOW+n.HIT_COVER;var kp=[{round:23,title:`Round 23: Who you’ll anger`,lines:[`THE CITY (CONTRACTS tab): Corporate, Foundry and Syndicate hold the districts. ▼ SHIP shows where you are. The three jobs are in districts. Fuel = the links you jump. The faction that holds the ship’s district sets the fuel price.`,`FACTION JOB (×`+n.CITY_FACTION_PAY+`): a rival of the target hires you. The employer likes you more, and the target likes you less. BROKER JOB (×`+n.CITY_BROKER_PAY+`): the job is deniable. Only the target notices.`,`STANDING: one bar per faction. HATED (≤ `+n.STANDING_HATED+`): danger +1 step, +`+Math.round(n.STANDING_HATED_ALERT*100)+`% of their field awake, fuel costs more. LIKED (≥ +`+n.STANDING_LIKED+`): their jobs pay more, free intel against their enemies, fuel costs less. Standing fades `+n.STANDING_DRIFT+` a contract.`,`Factions are RIVALS, NEUTRAL or ALLIES with each other. Each city rolls this. Every standing change spills onto the other factions.`]},{round:22,title:`Round 22: What happened`,lines:[`After every hunt, the AFTER-ACTION PAGE opens. WHAT HAPPENED lists up to `+n.AAR_MAX_MOMENTS+` turning points: who found whom, hits that mattered, how the job swung, and the end.`,`WHAT IT COST lists people, repairs, pay, salvage and the books. “← T7” = the turning point behind that line. Tap a turning point to see it on the map as it was at that turn. DETAILS keeps the old panels.`,`HELD THE FIELD (job done): you see the whole story, and your downed ExoS come home (rebuild at half cost). FIELD LOST: the enemy side shows as ??? with a rough direction, and the wrecks stay out there.`,`The books: every job pays ×`+n.PAY_MULT+`. A completed contract adds a `+n.CONTRACT_BONUS+` cr bonus. A new company starts with `+n.START_FUEL+` fuel.`]},{round:21,title:`Round 21: The company`,lines:[`The game opens on your COMPANY, and it saves the company on this phone. Named operators have one skill each (STEADY AIM, QUIET MOVER, SHARP EARS, SENSOR TECH). They earn XP and level up.`,`When an ExoS goes down, its operator is CRITICAL. Carry them out, and they are benched for a while. Leave them, and they are KIA, on the MEMORIAL. Recruits come between contracts.`,`The roster: 3 ExoS, each with its own fit and damage. You keep them from hunt to hunt and from contract to contract. Before every hunt, pick a lance of 1 to 3.`,`The books: three contract offers (danger, 2 to 4 hunts, a fee on completion, fuel to get there). You pay wages and ship upkeep when a contract ends. The company can be in debt once. After that, it folds.`,`Repairs and rebuilds use parts (salvaged from kills, or bought). The MARKET sells parts, fuel, items, an ExoS now and then, and recruits. The hangar fits only what you own.`,`The ship: 7 hardpoints for modules (sensor boosts, quiet drop rig, suit bay, repair bay, medbay, salvage hold, fuel tanks, hull armour, berths and more). A painted ship may take a hull hit.`]},{round:20,title:`Round 20: Eyes from the ship`,lines:[`The ship’s scan is live: START CLOCK / PAUSE, with no time cap. RADAR = where. It pings everything, even silent units, outlines zones and opens the north and south drop zones.`,`THERMAL = what’s alive: zone types, warm units and their size. EM LISTEN = who. It hears only transmitters: first a count, then a fix and the CARD’s best guess.`,`Run any mix of sensors at once. Each sensor has its own ring (drag near a ring to move it), or use FULL MAP. Three bars on a contact show how hard each sensor looked.`,`ALT HIGH / MID / LOW. HIGH: big, weak, fuzzy rings, and quiet. LOW: small, strong, sharp rings (thermal most), and loud.`,`The RISK meter climbs while sensors are on and cools with them all off. A new step may add enemy units. The step you drop at wakes part of the field. From step 2, it may paint the ship.`,`Patrols walk, and new patrols arrive while you wait. Some jobs have a SCAN WINDOW. The job card shows it first.`,`After the hunt, THE SCAN on the result screen gives one line per stretch of your scan (set-up, minutes, what came back, risk added). It also shows what the drop rolled. SEND LOG sends these as [SCAN] lines.`]},{round:19,title:`Round 19: Listen before you land`,lines:[`After you pick a job, the ship can LISTEN: SKIP / SHORT / MEDIUM / LONG. SHORT = the roster and zone outlines. MEDIUM = zone types and a choice of 3 drop zones. LONG = blips for everything that emits, with the CARD’s best guess.`,`Blips start the hunt as stale SHIP contacts. You only know the zones through the scan.`,`Listening has costs. At any level: extra enemy units. MEDIUM and up: part of the field is awake, with a rough fix on your drop zone. LONG: maybe a painted ship, with 2 patrols waiting near your drop zone. The dial shows the risk. The result screen shows what happened.`,`The game builds hunt 1 after its scan. The fits then lock for the contract.`,`Every ExoS knows when a radar paints it (a red PAINTED ring). The RWR module adds the readout: range rings, a spoke to the radar, search vs lock and a best-guess ID. When you move, a wedge swings to where the radar must be.`,`Text on phones is bigger. Menus scroll instead of shrinking. The game never scales below 85%.`]},{round:18,title:`Round 18: Fit for the job`,lines:[`The HANGAR is the loadout screen. Tap a part of the ExoS, then tap a hardpoint to fit something to it. Start from Scout (Wisp), Line (Warden) or Brawler (Bulwark).`,`Weight: over the rated load, every move is louder and costs more Energy per tile (CREEP too). Far over it, each move costs +1 AP. Power = reactor output − draw. Batteries add to the pool.`,`Each location is a part. When you lose a part, its modules go offline. Only shots from behind hit the BACK.`,`THERMAL: heat comes from the reactor, the frame’s size, firing and sprinting. Turrets carry thermal sights. Thermal optics lets you read heat. A sniper turret hits targets up to 20 tiles away.`,`Contacts carry stacked sense tags (EO, RDR, ESM, IR, ACO, MZL), each with the ExoS that made it. Gold = the tag that holds the fix. ESM sits on the best fit of your bearing lines. A noise zone only widens it. Cover shows as a shield.`,`INTEL lists what the field listens on. The result screen says what found you first. PLAY SEED replays a hunt. QUIT goes back to the hangar. The game scales to its window.`]},{round:17,title:`Round 17: Eyes on the street`,lines:[`Drag from your ExoS to draw your move freehand. The line goes round walls. If you draw through scrap, the move crosses it (on purpose). Cyan = this turn’s AP. Red dashed = past it.`,`Drag the end handle to extend the line, or drag the middle to redraw from there. Tap-to-move still works.`,`Aim your eyes as you walk. Tap a point on your line. Then tap where the ExoS should look. Drag the eye marker to move it. You can place up to 3 per move. Turning is free now.`,`Your eyes work on every step. Anything new stops the move on that tile ("CONTACT — move stopped"). You keep the AP you didn’t spend.`,`Scrap and rubble are low cover (−15%). Walls are −25%. When you aim at a target in cover, the game outlines the piece that gives the cover.`]},{round:16,title:`Round 16: Rolled ground`,lines:[`Every hunt is a new district. The game packs it from irregular city pieces (half blocks, strips, L shapes, hand-drawn blocks) and cuts it at the map edge. The job card gives its size. Bigger districts have a bigger field.`,`Brown speckled scrap and rubble: slow (2 tiles of movement a tile), loud (+3 sound), low cover. Rusty walls are set pieces and street barricades. You can weave through a chicane, but you cannot see past it.`,`You start in a cleared staging area. Hover over anything on the map, or hold a finger on it, to see what it is. Cover that you share with your target (you both stand against it) does not count.`,`ESCORT: up to three routes per fork (NORTH / AHEAD / SOUTH), and levers to set forks ahead. A ring shows where the next move ends. You can give HOLD and HURRY orders. The transport is in the turn strip.`,`Every ExoS leaves on its own: walk into the green zone and tap EXTRACT. The hunt ends when all your living ExoS are out.`]},{round:15,title:`Round 15: Pick your fights`,lines:[`Jobs come in four types, shown at the top of each job card: UPLINK (stand in the ring and tap UPLINK), BOUNTY, RETRIEVE and ESCORT.`,`BOUNTY: every kill pays that enemy’s bounty (prices on the CARD). Reach the quota to win, then tap EXTRACT when you choose. The field has extra enemies.`,`RETRIEVE: PICK UP the guarded cargo. This alerts the whole field, and the field hunts the carrier. The carrier cannot SPRINT. HAND OFF to the other ExoS. Carry the cargo out the right edge.`,`ESCORT: a friendly transport walks from the left edge to the right edge. Keep it alive. At each fork, it waits for you to tap a route on the map.`]},{round:14,title:`Round 14: Read the signature`,lines:[`Every enemy is one of 9 variants (3 patrols, 3 turrets, 3 emplacements). The variants fight differently.`,`Tap a contact to see what your sensors detected (EMIT, pulses, moved or still, steps or a shot heard). The CARD lists the 9 variants, each with one bold TELL. "3 fit" shows how many variants still match.`,`ID calls a contact. A call on a turret or emplacement freezes its track. A right call before your eyes see the contact adds +10% to hit.`,`The TEST BED (on the HANGAR screen) has short scenarios. Each one tests one thing.`]},{round:13,title:`Round 13: Loud gets company`,lines:[`You make noise in two ways. EMIT (orange) is electronic: radar, ECM and uplink. It grows, fades slowly and carries far.`,`SOUND (pale ring with ticks) comes from moving and shooting. It has one radius per turn, carries through walls, and is gone at your next turn. A contact that you only hear is a hollow SOUND square. It is never enough to shoot at.`,`Patrols carry radios (a small, steady EMIT), so passive sensors find them. Turrets stay silent.`,`Two legs: lose one, and you can only CREEP. Lose both, and you CREEP at half distance.`,`THE PACK (splash toggle): when one enemy senses you, it alerts others nearby. Patrols leave their posts to hunt you.`]},{round:12,title:`Round 12: Pick your shot`,lines:[`Shots roll to hit. FIRE shows your chance, and the yellow ODDS line shows why (range, target moved, cover, a loud target).`,`A hit strikes a part: CORE, LEGS, ARMS (weapon) or MAST (sensors). The same rules apply to the enemy. Part damage carries through the contract. REPAIR fixes the worst part first.`]}],Ap=[{k:`pick`,q:`I picked this job for…`,a:[`The pay`,`Who it angers`,`Who it pleases`,`The fuel`,`The danger`]},{k:`anger`,q:`Who I angered…`,a:[`Will cost me later`,`Doesn’t matter yet`,`Didn’t notice`,`Not sure`]},{k:`city`,q:`The city screen felt…`,a:[`Clear`,`OK`,`Busy`,`Not sure`]}],jp=[[`After`,`After each hunt the after-action page opens. WHAT HAPPENED: up to `+n.AAR_MAX_MOMENTS+` turning points (T = the turn): first detections both ways, hits that mattered, objective swings, and the end; the end, any suit down or KIA and the first time the enemy found you are always there. WHAT IT COST: people, repairs, pay, salvage, the ship, and the books at a contract’s end (← T7 = the moment that caused it). Tap a moment to pulse it on the map: the units show as they were at that turn. HELD THE FIELD (job done) shows the enemy side in full and brings your downed ExoS home (rebuild at half cost); FIELD LOST shows it as ??? with a rough direction and leaves the wrecks (full rebuild). DETAILS: the old result panels.`],[`City`,`CONTRACTS shows the city: districts held by three factions, ▼ SHIP where you are, numbers on the three jobs. Tap a district for its job. FACTION JOB: a faction pays ×`+n.CITY_FACTION_PAY+` to hit a rival (employer +`+n.STANDING_EMPLOYER_GAIN+`, target −`+n.STANDING_TARGET_LOSS+` when done). BROKER JOB: deniable, ×`+n.CITY_BROKER_PAY+` (target −`+n.STANDING_BROKER_LOSS+`, nobody gains). Fuel = links jumped. Standing bars: HATED (≤ `+n.STANDING_HATED+`): danger +1 step, +`+Math.round(n.STANDING_HATED_ALERT*100)+`% of their field awake at the drop, fuel ×`+n.STANDING_HATED_FUEL_MULT+` in their districts. LIKED (≥ +`+n.STANDING_LIKED+`): their jobs pay ×`+n.STANDING_LIKED_PAY+`, free intel against their enemies (radar band 1 on the scan), fuel ×`+n.STANDING_LIKED_FUEL_MULT+`. Everything fades `+n.STANDING_DRIFT+` toward 0 each contract. Factions are RIVALS, NEUTRAL or ALLIES with each other (rolled per city, shown under the map): every change spills ×`+n.STANDING_SPILL+` onto the others (work for one and its rivals dislike you; hit one and its allies do).`],[`Company`,`The game opens on your COMPANY (saved on this phone). CONTRACTS: the city map with three jobs, and the books. ROSTER: your operators; the letter buttons put one in a suit. SUITS: each ExoS’s damage, rounds and shells, repairs (parts + credits). MARKET: parts, fuel, hangar items, an ExoS now and then, recruits. SHIP: 7 hardpoints for modules. RECRUITS: hire new operators between contracts (the roster holds `+n.OP_CAP+`). MEMORIAL: who you lost. Damage carries from contract to contract. The three offers are never all one danger. TAKE IT on an offer runs the usual job → scan → hangar → hunt flow; after the contract you come back here. NEW COMPANY (tap twice) starts over. HANGAR · TOOLS: hangar, test bed, PLAY SEED, log.`],[`Books`,`A completed contract pays its fee plus a `+n.CONTRACT_BONUS+` cr completion bonus. Hold the field (win the job) and every ExoS that went down comes home: its rebuild costs half. Bail or lose and the wreck is gone: full rebuild. Credits: hunt pay and contract fees come in; wages (per operator, more for veterans), ship upkeep and hull repairs go out when a contract ends. Below 0 you take debt once; still in debt a contract later, or more than `+n.DEBT_LIMIT+` down, and the company folds. FUEL: each contract costs fuel to reach. PARTS: repairs and rebuilds use them; kills salvage them into the hold. The hangar only fits items the company owns.`],[`Ship`,`Seven hardpoints, one module each (SHIP tab, between contracts). Scan modules make one sensor faster and quieter; QUIET DROP RIG wakes less of the field; SUIT BAY carries one more ExoS (the hull carries 2); REPAIR BAY, MEDBAY, SALVAGE HOLD and ARMOURY help after a hunt; FUEL TANKS, EFFICIENT ENGINES and HULL ARMOUR between contracts; OPERATOR BERTHS room for 2 more operators. A painted ship may take a hull hit.`],[`Lance`,`Before every hunt, the job screen shows each suit with a button: tap it to pick its operator or leave it aboard (STAYS ABOARD). 1 to `+n.START_SUITS+` suits drop; more suits = more guns and more eyes, but more to carry home. Destroyed suits can’t drop until rebuilt; benched operators can’t drop.`],[`Operators`,`Each ExoS has a named operator with one skill: STEADY AIM (+to hit), QUIET MOVER (quieter steps), SHARP EARS (hears further), SENSOR TECH (IDs firm up faster). Coming back from a hunt gives XP (more on a win); at level 2 (★ veteran) and 3 the skill gets stronger. A suit that is destroyed goes down and its operator is CRITICAL: end another suit’s turn inside the red ring to carry them, then get out. Carried out = benched `+n.OP_BENCH+` contracts; left behind = KIA.`],[`Goal`,`Each job has a type (top of the job card). UPLINK: stand in the gold ring and tap UPLINK on 3 turns, or destroy every enemy. BOUNTY: kills pay their bounty (prices on the CARD); reach the quota for a win, then extract at the right edge when you choose. RETRIEVE: PICK UP the cargo (the whole field then hunts the carrier, who can’t sprint), HAND OFF if needed, carry it out the right edge. ESCORT: keep the transport alive from the left edge to the right; at each fork, tap a route on the map (NORTH, AHEAD or SOUTH, where the streets are open). You can set the route at forks ahead of time (lit ✓); an unset fork stops it. HOLD makes it wait a round; HURRY makes it sprint its next move (3 of each per hunt). The gold dashed ring shows where its next move ends; T in the turn strip is its turn. To leave, walk into the green zone on the right and tap EXTRACT, mech by mech; the hunt ends when all your living mechs are out. Lose if both mechs are destroyed.`],[`Scan`,`After you take a job the ship scans before you drop. Turn sensors on (any mix; each has its own ring), drag a ring onto what matters (or FULL MAP: the whole map, weaker), START CLOCK; PAUSE to think. RADAR = where: pings every unit (silent too) but never names it, outlines zones, opens drop zones. THERMAL = what’s alive: zone types, warm units and their size (cold turrets hidden). EM LISTEN = who: only transmitters, a count, then a fix and the CARD’s best guess. Full strength inside the solid ring, none past the dashed one. The three bars on a contact = how hard radar / thermal / EM have looked. RISK climbs while sensors are on (radar most) and cools with all of them off: a new step may call a unit in, and the step you drop at sets how much of the field is awake and (step 2+) whether the ship is painted. Patrols walk and new ones arrive while you wait. ALT HIGH / MID / LOW: high = bigger rings, weaker and fuzzier, quieter; low = small rings, stronger and sharper (thermal most), louder. Some jobs have a SCAN WINDOW (top of the job card): the scan ends then. The west edge is always a drop zone; north and south open once RADAR has looked. What the ship fixed starts the hunt as stale SHIP contacts. After the hunt, THE SCAN on the result screen says what each stretch of your scan found and cost, and what the drop rolled. Hunt 1 is built after its scan.`],[`Suit`,`The HANGAR (loadout screen) builds both ExoS. Tap a part of the suit to see its hardpoints (SENSOR, WEAPON, INTERNAL, UTILITY, MOBILITY, OPEN takes anything) and tap one to fit a module. Frames: Wisp (light, quiet on EM, few hardpoints, no back), Warden (the all-rounder), Bulwark (heavy, loud on EM, lots of room). LOAD: every module and plate weighs something; over the rated load every move is louder and every tile costs more Energy (creep too), far over it moves cost +1 AP, over max it can’t launch. POWER: Energy back each turn = reactor output − what your modules draw; batteries add to the pool. Plates add hits to a location. Hunt 1’s hangar opens after its scan, so you can build for what you heard; the fit then locks for the whole contract.`],[`Heat`,`IR (heat) is a third channel. Your steady heat is your reactor (Hot core runs warm, Cold-burn cold) plus your frame’s size; firing and sprinting add heat that cools a little each turn. A thermal sight (turrets carry them; you can fit Thermal optics) sees heat like eyes see you, in line of sight and ahead of its facing, out to about `+n.IR_TILES_PER_PT+` tiles per point of heat (max `+n.IR_RANGE+`). The HUD shows your IR and that range. A heat fix is good enough to shoot at but doesn’t tell you the variant.`],[`RWR`,`Every suit knows when an enemy radar has swept over it: a red dashed ring, PAINTED and the round (no direction). The RWR module (MAST sensor) gives the readout. Rings round the suit = close / medium / far (a guess from signal strength). A spoke = where it came from (±`+n.RWR_BEARING_ERR+`°); tip icon: open arc = search, filled diamond = lock; label = the CARD’s best guess. Solid spoke = heard where you stand. Once you move: faint frozen spoke + dashed wedge (where the radar must be from here) + a “heard here” tick on the map. Tap a spoke for details.`],[`Parts`,`Each location is a part with its own hits: MAST (sensors), ARMS (weapon), CORE, BACK and LEGS. A destroyed part takes what is mounted on it offline, and the button says which part (SNS, WPN, BCK). The BACK is only hit by shots from behind your facing. CORE gone = the ExoS is destroyed.`],[`Turns`,`Everyone acts in initiative order (strip, top right). On your mech's turn you spend AP (the ● pips). END TURN passes to the next unit.`],[`Move`,`Tap the map to plot a path, or drag from your ExoS to draw one freehand (it goes round walls; scrap you draw through is crossed on purpose). Drag the round end handle to carry it on, or drag from the middle to redraw from there. Pick CREEP, NORM or SPRINT, then tap MOVE. Faster covers more ground but is louder. A drawn path is cyan as far as your AP goes, red dashed past it. No path carries over to the next turn.`],[`Look`,`Your eyes see ahead of your facing (and all round up close), on every step of a move. Facing follows the way you walk. On a drawn path, tap a point, then tap where it should look (an eye marker drops there; drag it to move it): the suit turns there and keeps looking that way (up to `+n.FACE_WAYPOINTS_MAX+` per move). Turning to face something is free, for you and the enemy. If a step shows something new, the move stops on that tile and you keep the AP you didn’t spend.`],[`Find`,`Enemies are hidden. A contact is a red square with a circle: the circle is how unsure you are. The tags by its name are the senses that have fixed it lately, stacked: gold = the one holding the fix now, cyan = the others, with the suit that made it (EO A = A’s eyes, exact; RDR radar, “2W” = through 2 walls so still fuzzy; ESM crossed passive bearings; IR heat; ACO sound only; MZL its muzzle flash, it shot at you; SHIP the pre-drop scan’s blip; dim = stale). A grey, struck-through IR tag = your thermal optics are looking right at it and see no heat: it runs cold. An amber dashed box round the gold tag = a noise zone is still blurring that fix. A vaguer fix never drags a good one away, and a turret or emplacement you know stays put. Passive sensors draw cyan bearing lines; two crossing lines make a fix. RADAR gives a sharp fix but is very loud.`],[`Fight`,`Tap a contact to select it. FIRE needs a tight fix, range and line of sight; the button says why if it's blocked, or shows your hit chance. Hits strike a part (core, legs, arms, mast; the back only from behind). Cover close to the target costs −`+n.HIT_COVER+`% for a wall or set piece, −`+n.HIT_COVER_LOW+`% for scrap (low cover), unless you are right up against the same piece of cover yourself. When you aim, the cover piece is outlined and a shield shows by your target (the ODDS line gives the number). MORTAR fires on a fix with no line of sight, but scatters more on a fuzzy one.`],[`Noise`,`Two kinds. EMIT (orange bar, orange dashed ring) is electronic: radar, ECM and uplink add to it, it fades a little each turn, and passive sensors pick it up from far away. SOUND (pale ring with ticks) is moving and shooting: one radius per turn (the loudest thing you did), heard through walls, gone at your next turn.`],[`Ground`,`Every hunt is a new district (the job card gives its size), packed from irregular city pieces, so streets jog, narrow and dead-end. Blue dotted areas are quiet ground: you are harder to hear there. Amber hatched areas are noise: fixes on anything inside are blurry. You only see the zones the ship’s scan found (grey dashed “ZONE ?” = there is one, type unknown). Brown speckled scrap is slow (2 tiles of movement a tile) and loud (+3 sound), but it is low cover (−`+n.HIT_COVER_LOW+`% to hit). Rusty outlined shapes are walls: set pieces in the blocks, and barricades that shut a street. A chicane (walls on alternate lanes) can be weaved through but not seen past.`],[`ID`,`Enemies come in 10 variants (4 of them turrets, including the sniper: a Long gun that hits out to 20 tiles, but only on a firm lock). Tap a contact to see what your sensors have picked up about it, open the CARD to compare, then tap ID to call it. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`],[`ECM`,`ECM masks you each turn it is on. GHOST places a fake contact for enemies.`],[`Camera`,`Drag to pan. Z+ / Z− zoom. CTR recentres. QUIT in a contract hunt asks: SAVE & QUIT (stop now; RESUME on the company screen puts you back on this turn) or BAIL CONTRACT (give it up: no fee, wages and upkeep still paid; the menu shows the cost). Elsewhere QUIT (tap twice) goes back to the hangar. Nobody is hurt by a quit.`],[`Tips`,`Hover the mouse over anything on the map, or hold a finger on it, to see what it is and what it does.`],[`Debug`,`DEBUG: REROLL JOBS (job screen) rolls two new jobs for the same hunt, e.g. to get the job type you want to test. The log line notes it.`]],Mp=`<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;font:bold 12px monospace" aria-label="Map legend">
