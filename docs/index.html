ows IR and how far). Fit Thermal optics on your mast to see heat too.`,`NEW (Jamie’s ask): a SNIPER turret. Its Long gun hits out to 20 tiles and barely loses accuracy with range, with a very loud crack. It still needs a firm lock: past eye range that means its thermal sight, so a hot suit is the one it can reach. It’s on the CARD (10 variants now).`,`NEW (r18-s4): weight costs Energy too. Every point over your rated load adds +`+e.OVERLOAD_EN_PER_TILE+` Energy to every tile you move, creeping included (on top of the louder moves). A heavy suit drains its battery just walking; a Hot core’s extra output can pay for it.`,`FIXED (r18-s8): contacts close together stack their labels; each contact has a tag for the sense holding its fix (EYE, RDR, RDR 2W = radar through 2 walls, EM, IR, SND, FLASH, ALARM; dim = stale). Cover: buildings, set pieces and floor debris are separate pieces, so standing by a building no longer cancels debris cover. A move only stops for a contact that’s new to you. Every log line has the hunt’s seed; PLAY SEED (hangar) replays it: type a seed or paste a log line.`,`FIXED (r18-s7): the game scales to its window (phone, iPad split screen, iPad full screen) and keeps a gap at the top; the hangar’s selected body part is outlined and named; the pick sheet answers taps on iPad; a NEW BUILD button appears when a newer build is published.`,`NEW (r18-s5): QUIT, next to CTR: tap it twice to drop the hunt (and its contract) and go back to the hangar.`,`TEST BED: "Heavy load", "Back door" and "Warm core".`],round:18,howTo:`Play the two new scenarios first, then hunts in contracts with all four job types. Build each ExoS for the job and the INTEL before you start; try different frames. After each hunt, tap the answers and add a note about your build. When you finish, tap SEND LOG and send it to Jamie.`};``+e.FACE_WAYPOINTS_MAX,``+e.HIT_COVER_LOW+e.HIT_COVER;var Fs=[{round:17,title:`Round 17: Eyes on the street`,lines:[`Drag from your ExoS to draw your move freehand (it goes round walls; scrap you draw through is crossed on purpose). Cyan = this turn’s AP, red dashed = past it. Drag the end handle to carry on, or drag the middle to redraw from there. Tap-to-move still works.`,`Aim your eyes as you walk: tap a point on your line, then tap where it should look. Drag the eye marker to move it; up to 3 per move. Turning is free now.`,`Your eyes work on every step. Anything new stops the move on that tile ("CONTACT — move stopped"), and you keep the AP you didn’t spend.`,`Scrap and rubble are low cover (−15%, walls −25%). Aiming at a target in cover outlines the piece giving it.`]},{round:16,title:`Round 16: Rolled ground`,lines:[`Every hunt is a new district packed from irregular city pieces (half blocks, strips, L shapes, hand-drawn blocks), cut off at the map edge; the job card gives its size. Bigger districts have a bigger field.`,`Brown speckled scrap and rubble: slow (2 tiles of movement a tile), loud (+3 sound), low cover. Rusty walls are set pieces and street barricades; chicanes can be weaved through but not seen past.`,`You start in a cleared staging area. Hover or hold a finger on anything on the map to see what it is. Cover you share with your target (both up against it) does not count.`,`Escort: up to three routes per fork (NORTH / AHEAD / SOUTH), levers to set forks ahead, a ring for where the next move ends, HOLD and HURRY orders, and the transport in the turn strip.`,`Every mech leaves on its own: walk into the green zone and tap EXTRACT. The hunt ends once all your living mechs are out.`]},{round:15,title:`Round 15: Pick your fights`,lines:[`Jobs come in four types, shown on top of each job card: UPLINK (stand in the ring and uplink), BOUNTY, RETRIEVE and ESCORT.`,`BOUNTY: every kill pays that enemy’s bounty (prices on the CARD). Reach the quota for a win, then extract when you choose. The field has extra enemies.`,`RETRIEVE: PICK UP the guarded cargo. That alerts the whole field, which hunts the carrier (who can’t sprint). HAND OFF to the other mech, carry it out the right edge.`,`ESCORT: a friendly transport walks from the left edge to the right. Keep it alive; at each fork it waits for you to tap a route on the map.`]},{round:14,title:`Round 14: Read the signature`,lines:[`Every enemy is one of 9 variants (3 patrols, 3 turrets, 3 emplacements). They fight differently.`,`Tap a contact to see what your sensors picked up (EMIT, pulses, moved or still, steps or a shot heard). The CARD lists the 9 with one bold TELL each; "3 fit" shows how many still match.`,`ID calls a contact. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`,`The TEST BED (loadout screen): short scenarios that test one thing each.`]},{round:13,title:`Round 13: Loud gets company`,lines:[`Noise is two things. EMIT (orange) is electronic: radar, ECM and uplink. It builds up, fades slowly and carries far.`,`SOUND (pale ring with ticks) is moving and shooting. One radius per turn, heard through walls, gone at your next turn. A heard-only contact is a hollow SOUND square: never enough to shoot.`,`Patrols carry radios (a small steady EMIT), so passive sensors find them. Turrets stay silent.`,`Two legs: lose one and you can only CREEP; lose both and you creep at half distance.`,`THE PACK (splash toggle): one enemy that senses you alerts others nearby, and patrols leave their posts to hunt you.`]},{round:12,title:`Round 12: Pick your shot`,lines:[`Shots roll to hit: FIRE shows your chance and the yellow ODDS line shows why (range, target moved, cover, a loud target).`,`A hit strikes a part: core, legs, weapon or sensors. Same rules for the enemy. Part damage carries through the contract; REPAIR fixes the worst part first.`]}],Is=[{k:`gave`,q:`To fit the build for this job, I gave up…`,a:[`Armour`,`A sensor or ECM`,`Power or weight`,`Nothing really`]},{k:`felt`,q:`Mid-hunt, my build…`,a:[`Was too heavy / loud`,`Ran out of power`,`Lost a part I needed`,`Showed up fine`,`Didn’t notice it`]},{k:`link`,q:`My build showed up in the hunt…`,a:[`Yes`,`It didn’t`,`Not sure`]}],Ls=[[`Goal`,`Each job has a type (top of the job card). UPLINK: stand in the gold ring and tap UPLINK on 3 turns, or destroy every enemy. BOUNTY: kills pay their bounty (prices on the CARD); reach the quota for a win, then extract at the right edge when you choose. RETRIEVE: PICK UP the cargo (the whole field then hunts the carrier, who can’t sprint), HAND OFF if needed, carry it out the right edge. ESCORT: keep the transport alive from the left edge to the right; at each fork, tap a route on the map (NORTH, AHEAD or SOUTH, where the streets are open). You can set the route at forks ahead of time (lit ✓); an unset fork stops it. HOLD makes it wait a round; HURRY makes it sprint its next move (3 of each per hunt). The gold dashed ring shows where its next move ends; T in the turn strip is its turn. To leave, walk into the green zone on the right and tap EXTRACT, mech by mech; the hunt ends when all your living mechs are out. Lose if both mechs are destroyed.`],[`Suit`,`The HANGAR (loadout screen) builds both ExoS. Tap a part of the suit to see its hardpoints (SENSOR, WEAPON, INTERNAL, UTILITY, MOBILITY, OPEN takes anything) and tap one to fit a module. Frames: Wisp (light, quiet on EM, few hardpoints, no back), Warden (the all-rounder), Bulwark (heavy, loud on EM, lots of room). LOAD: every module and plate weighs something; over the rated load every move is louder and every tile costs more Energy (creep too), far over it moves cost +1 AP, over max it can’t launch. POWER: Energy back each turn = reactor output − what your modules draw; batteries add to the pool. Plates add hits to a location. The fit locks for the whole contract.`],[`Heat`,`IR (heat) is a third channel. Your steady heat is your reactor (Hot core runs warm, Cold-burn cold) plus your frame’s size; firing and sprinting add heat that cools a little each turn. A thermal sight (turrets carry them; you can fit Thermal optics) sees heat like eyes see you, in line of sight and ahead of its facing, out to about `+e.IR_TILES_PER_PT+` tiles per point of heat (max `+e.IR_RANGE+`). The HUD shows your IR and that range. A heat fix is good enough to shoot at but doesn’t tell you the variant.`],[`Parts`,`Each location is a part with its own hits: MAST (sensors), ARMS (weapon), CORE, BACK and LEGS. A destroyed part takes what is mounted on it offline, and the button says which part (SNS, WPN, BCK). The BACK is only hit by shots from behind your facing. CORE gone = the ExoS is destroyed.`],[`Turns`,`Everyone acts in initiative order (strip, top right). On your mech's turn you spend AP (the ● pips). END TURN passes to the next unit.`],[`Move`,`Tap the map to plot a path, or drag from your ExoS to draw one freehand (it goes round walls; scrap you draw through is crossed on purpose). Drag the round end handle to carry it on, or drag from the middle to redraw from there. Pick CREEP, NORM or SPRINT, then tap MOVE. Faster covers more ground but is louder. A drawn path is cyan as far as your AP goes, red dashed past it. No path carries over to the next turn.`],[`Look`,`Your eyes see ahead of your facing (and all round up close), on every step of a move. Facing follows the way you walk. On a drawn path, tap a point, then tap where it should look (an eye marker drops there; drag it to move it): the suit turns there and keeps looking that way (up to `+e.FACE_WAYPOINTS_MAX+` per move). Turning to face something is free, for you and the enemy. If a step shows something new, the move stops on that tile and you keep the AP you didn’t spend.`],[`Find`,`Enemies are hidden. A contact is a red square with a circle: the circle is how unsure you are. The small tag by its name says which sense holds the fix (EYE exact; RDR radar, “2W” = through 2 walls so still fuzzy; EM crossed bearings; IR heat; SND sound only; FLASH it shot at you; ALARM shared; dim = stale). Passive sensors draw cyan bearing lines; two crossing lines make a fix. RADAR gives a sharp fix but is very loud.`],[`Fight`,`Tap a contact to select it. FIRE needs a tight fix, range and line of sight; the button says why if it's blocked, or shows your hit chance. Hits strike a part (core, legs, arms, mast; the back only from behind). Cover close to the target costs −`+e.HIT_COVER+`% for a wall or set piece, −`+e.HIT_COVER_LOW+`% for scrap (low cover), unless you are right up against the same piece of cover yourself. When you aim, the cover piece is outlined. MORTAR fires on a fix with no line of sight, but scatters more on a fuzzy one.`],[`Noise`,`Two kinds. EMIT (orange bar, orange dashed ring) is electronic: radar, ECM and uplink add to it, it fades a little each turn, and passive sensors pick it up from far away. SOUND (pale ring with ticks) is moving and shooting: one radius per turn (the loudest thing you did), heard through walls, gone at your next turn.`],[`Ground`,`Every hunt is a new district (the job card gives its size), packed from irregular city pieces, so streets jog, narrow and dead-end. Blue dotted areas are quiet ground: you are harder to hear there. Amber hatched areas are noise: fixes on anything inside are blurry. Brown speckled scrap is slow (2 tiles of movement a tile) and loud (+3 sound), but it is low cover (−`+e.HIT_COVER_LOW+`% to hit). Rusty outlined shapes are walls: set pieces in the blocks, and barricades that shut a street. A chicane (walls on alternate lanes) can be weaved through but not seen past.`],[`ID`,`Enemies come in 10 variants (4 of them turrets, including the sniper: a Long gun that hits out to 20 tiles, but only on a firm lock). Tap a contact to see what your sensors have picked up about it, open the CARD to compare, then tap ID to call it. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`],[`ECM`,`ECM masks you each turn it is on. GHOST places a fake contact for enemies.`],[`Camera`,`Drag to pan. Z+ / Z− zoom. CTR recentres. QUIT (tap twice) drops the hunt and its contract and goes back to the hangar.`],[`Tips`,`Hover the mouse over anything on the map, or hold a finger on it, to see what it is and what it does.`],[`Debug`,`DEBUG: REROLL JOBS (job screen) rolls two new jobs for the same hunt, e.g. to get the job type you want to test. The log line notes it.`]],Rs=`<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;font:bold 12px monospace" aria-label="Map legend">
