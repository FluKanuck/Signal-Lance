ieces are still full cover. When you aim at a target in cover, the piece giving the cover is outlined (yellow = wall, tan = scrap), and green shows cover you share with it (no penalty).`,`Escort route buttons no longer sit under the HUD text.`,`TEST BED: "Side street", "Trip wire" and "Scrap line".`],round:17,howTo:`Play the three new scenarios first, then about 10 hunts in contracts. Try drawing your moves and aiming down alleys. After each hunt, tap the answers (the first one matters most) and add a note, especially if a move stopped when you didn’t want it to. When you finish, tap SEND LOG and send it to Jamie.`},Xa=[{round:16,title:`Round 16: Rolled ground`,lines:[`Every hunt is a new district packed from irregular city pieces (half blocks, strips, L shapes, hand-drawn blocks), cut off at the map edge; the job card gives its size. Bigger districts have a bigger field.`,`Brown speckled scrap and rubble: slow (2 tiles of movement a tile), loud (+3 sound), low cover. Rusty walls are set pieces and street barricades; chicanes can be weaved through but not seen past.`,`You start in a cleared staging area. Hover or hold a finger on anything on the map to see what it is. Cover you share with your target (both up against it) does not count.`,`Escort: up to three routes per fork (NORTH / AHEAD / SOUTH), levers to set forks ahead, a ring for where the next move ends, HOLD and HURRY orders, and the transport in the turn strip.`,`Every mech leaves on its own: walk into the green zone and tap EXTRACT. The hunt ends once all your living mechs are out.`]},{round:15,title:`Round 15: Pick your fights`,lines:[`Jobs come in four types, shown on top of each job card: UPLINK (stand in the ring and uplink), BOUNTY, RETRIEVE and ESCORT.`,`BOUNTY: every kill pays that enemy’s bounty (prices on the CARD). Reach the quota for a win, then extract when you choose. The field has extra enemies.`,`RETRIEVE: PICK UP the guarded cargo. That alerts the whole field, which hunts the carrier (who can’t sprint). HAND OFF to the other mech, carry it out the right edge.`,`ESCORT: a friendly transport walks from the left edge to the right. Keep it alive; at each fork it waits for you to tap a route on the map.`]},{round:14,title:`Round 14: Read the signature`,lines:[`Every enemy is one of 9 variants (3 patrols, 3 turrets, 3 emplacements). They fight differently.`,`Tap a contact to see what your sensors picked up (EMIT, pulses, moved or still, steps or a shot heard). The CARD lists the 9 with one bold TELL each; "3 fit" shows how many still match.`,`ID calls a contact. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`,`The TEST BED (loadout screen): short scenarios that test one thing each.`]},{round:13,title:`Round 13: Loud gets company`,lines:[`Noise is two things. EMIT (orange) is electronic: radar, ECM and uplink. It builds up, fades slowly and carries far.`,`SOUND (pale ring with ticks) is moving and shooting. One radius per turn, heard through walls, gone at your next turn. A heard-only contact is a hollow SOUND square: never enough to shoot.`,`Patrols carry radios (a small steady EMIT), so passive sensors find them. Turrets stay silent.`,`Two legs: lose one and you can only CREEP; lose both and you creep at half distance.`,`THE PACK (splash toggle): one enemy that senses you alerts others nearby, and patrols leave their posts to hunt you.`]},{round:12,title:`Round 12: Pick your shot`,lines:[`Shots roll to hit: FIRE shows your chance and the yellow ODDS line shows why (range, target moved, cover, a loud target).`,`A hit strikes a part: core, legs, weapon or sensors. Same rules for the enemy. Part damage carries through the contract; REPAIR fixes the worst part first.`]}],Za=[{k:`look`,q:`Aiming your eyes on the path…`,a:[`Found something`,`Ruled a street out`,`Didn’t use it`,`Too fiddly`]},{k:`stop`,q:`When a move stopped…`,a:[`It saved me`,`Gave me time to plan`,`It nagged`,`Never stopped`]},{k:`draw`,q:`Drawing the move…`,a:[`Changed how I crossed`,`Same as tapping`,`Fought me`,`Didn’t draw`]}],Qa=[[`Goal`,`Each job has a type (top of the job card). UPLINK: stand in the gold ring and tap UPLINK on 3 turns, or destroy every enemy. BOUNTY: kills pay their bounty (prices on the CARD); reach the quota for a win, then extract at the right edge when you choose. RETRIEVE: PICK UP the cargo (the whole field then hunts the carrier, who can’t sprint), HAND OFF if needed, carry it out the right edge. ESCORT: keep the transport alive from the left edge to the right; at each fork, tap a route on the map (NORTH, AHEAD or SOUTH, where the streets are open). You can set the route at forks ahead of time (lit ✓); an unset fork stops it. HOLD makes it wait a round; HURRY makes it sprint its next move (3 of each per hunt). The gold dashed ring shows where its next move ends; T in the turn strip is its turn. To leave, walk into the green zone on the right and tap EXTRACT, mech by mech; the hunt ends when all your living mechs are out. Lose if both mechs are destroyed.`],[`Turns`,`Everyone acts in initiative order (strip, top right). On your mech's turn you spend AP (the ● pips). END TURN passes to the next unit.`],[`Move`,`Tap the map to plot a path, or drag from your ExoS to draw one tile by tile (it skips walls; scrap you draw through is crossed on purpose). Pick CREEP, NORM or SPRINT, then tap MOVE. Faster covers more ground but is louder. A drawn path turns red and dashed past where your AP runs out; the gold ring is where you stop. No path carries over to the next turn.`],[`Look`,`Your eyes see ahead of your facing (and all round up close), on every step of a move. Facing follows the way you walk. On a drawn path, tap a tile and drag to aim: the suit turns there and keeps looking that way (up to `+e.FACE_WAYPOINTS_MAX+` per move; the first uses the free turn, then `+e.AP_TURN+` AP each). If a step shows something new, the move stops on that tile and you keep the AP you didn’t spend.`],[`Find`,`Enemies are hidden. A contact is a red square with a circle: the circle is how unsure you are. Passive sensors draw cyan bearing lines; two crossing lines make a fix. RADAR gives a sharp fix but is very loud.`],[`Fight`,`Tap a contact to select it. FIRE needs a tight fix, range and line of sight; the button says why if it's blocked, or shows your hit chance. Hits strike a part (core, legs, weapon, sensors). Cover close to the target costs −`+e.HIT_COVER+`% for a wall or set piece, −`+e.HIT_COVER_LOW+`% for scrap (low cover), unless you are right up against the same piece of cover yourself. When you aim, the cover piece is outlined. MORTAR fires on a fix with no line of sight, but scatters more on a fuzzy one.`],[`Noise`,`Two kinds. EMIT (orange bar, orange dashed ring) is electronic: radar, ECM and uplink add to it, it fades a little each turn, and passive sensors pick it up from far away. SOUND (pale ring with ticks) is moving and shooting: one radius per turn (the loudest thing you did), heard through walls, gone at your next turn.`],[`Ground`,`Every hunt is a new district (the job card gives its size), packed from irregular city pieces, so streets jog, narrow and dead-end. Blue dotted areas are quiet ground: you are harder to hear there. Amber hatched areas are noise: fixes on anything inside are blurry. Brown speckled scrap is slow (2 tiles of movement a tile) and loud (+3 sound), but it is low cover (−`+e.HIT_COVER_LOW+`% to hit). Rusty outlined shapes are walls: set pieces in the blocks, and barricades that shut a street. A chicane (walls on alternate lanes) can be weaved through but not seen past.`],[`ID`,`Enemies come in 9 variants. Tap a contact to see what your sensors have picked up about it, open the CARD to compare, then tap ID to call it. A turret or emplacement call freezes its track; a right call before eyes adds +10% to hit.`],[`ECM`,`ECM masks you each turn it is on. GHOST places a fake contact for enemies.`],[`Camera`,`Drag to pan. Z+ / Z− zoom. CTR recentres.`],[`Tips`,`Hover the mouse over anything on the map, or hold a finger on it, to see what it is and what it does.`],[`Debug`,`DEBUG: REROLL JOBS (job screen) rolls two new jobs for the same hunt, e.g. to get the job type you want to test. The log line notes it.`]],$a=`<svg viewBox="0 0 300 300" width="300" height="300" style="max-width:100%;font:bold 12px monospace" aria-label="Map legend">

000;gap:4px;font:700 14px monospace;display:flex;position:fixed}#init span{border:1px solid var(--line);text-align:center;background:#00000073;border-radius:4px;min-width:22px;padding:2px 5px}#init span.me{color:#9cf;border-color:#9cf}#init span.ally{color:#7e9;border-color:#7e9}#init span.now{background:var(--btnOn);color:#fff}#init span.done{opacity:.4}#lver{opacity:.6;font-size:11px}#jobs,#cres{justify-content:flex-start}.jrow{align-items:stretch;gap:12px;width:100%;max-width:900px;display:flex}.job,.hunt{text-align:left;border:1px solid var(--line);border-radius:6px;flex-direction:column;flex:1;gap:8px;min-width:0;padding:8px;display:flex}.jintel{border-left:3px solid var(--btnOn);flex:1;padding-left:8px;font-size:13px;line-height:1.35}.jtake,#bNewC{background:var(--btnOn);min-height:56px;font-size:17px}#jlance{font-size:14px;line-height:1.5}#jlance b.lost{color:#e66}#jlance>div{margin-bottom:6px}.rfrow{flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin-top:4px;display:flex}button.rf{min-width:84px;min-height:48px;font-size:12px;line-height:1.2}.cap{opacity:.7;font-size:11px}.hunt{font-size:12px;line-height:1.4}#splash,#basics{z-index:7}#res{justify-content:flex-start}.doc{text-align:left;justify-content:flex-start}.dtitle{width:100%;max-width:760px;font-size:20px;font-weight:700}.dtext{width:100%;max-width:760px;font-size:14px;line-height:1.45}.dtext p{margin:0 0 8px}.dtext ul{margin:0 0 8px;padding-left:20px}.drow{align-items:flex-start;gap:16px;width:100%;max-width:900px;display:flex}.drow .dtext{flex:1.4}.dart{flex-direction:column;flex:1;gap:8px;min-width:0;display:flex}button.go{background:var(--btnOn);min-width:140px;font-size:16px}#tester{background:var(--btn);width:min(320px,100%);min-height:48px;color:var(--fg);border:1px solid var(--line);box-sizing:border-box;border-radius:6px;padding:0 10px;font:16px monospace}#resQ{flex-direction:column;gap:6px;width:100%;max-width:760px;display:flex}.qrow{flex-wrap:wrap;align-items:center;gap: <canvas id="cv"></canvas>
<div id="tip" hidden></div>
<div id="hud"></div>
<div id="init"></div>
<div id="rcol" class="col">
  <button id="bRadar">RADAR</button>
  <button id="bEcm">ECM</button>
  <button id="bGhost">GHOST</button>
  <div class="zrow"><button id="bMortar">MORTAR</button><button id="bFire">FIRE</button></div>
  <button id="bEnd">END TURN</button>
</div>
<div id="lcol" class="col">
  <div class="zrow"><button id="bCard">CARD</button><button id="bId">ID</button></div>
  <div class="zrow"><button id="bZin">Z+</button><button id="bZout">Z−</button></div>
  <button id="bCtr">CTR</button>
</div>
<div id="brow">
  <button id="bCreep">CREEP</button>
  <button id="bNorm">NORM</button>
  <button id="bSprint">SPRINT</button>
  <button id="bMove">MOVE</button>
  <button id="bUp">UPLINK</button>
  <button id="bHold" hidden>HOLD</button>
  <button id="bHurry" hidden>HURRY</button>
  <button id="bExtract" hidden>EXTRACT</button>
</div>
<button id="bDbg">DBG</button>
<div id="ver"></div>
<div id="load" class="panel" hidden>
  <div id="mods"></div>
  <div id="lside">
    <div class="zrow" style="align-items:center"><button id="bLA">MECH A</button><button id="bLB">MECH B</button><div id="slots"></div></div>
    <div id="lver"></div>
    <div id="intel"></div>
    <div class="zrow"><button id="bQuick">LENGTH: 3 HUNTS</button><button id="bTB">TEST BED</button></div>
    <button id="bLaunch">START CONTRACT</button>
    <div id="logv"></div>
    <div class="zrow"><button id="bSend">SEND LOG</button><button id="bCopy">COPY LOG</button><button id="bHelp">BASICS</button></div>
    <textarea id="logta" rows="4" readonly hidden></textarea>
  </div>
</div>
<div id="res" class="panel" hidden>
  <div id="resTxt" style="font-size:18px;font-weight:bold"></div>
  <div id="resWhy"></div>
  <div id="resQ"></div>
  <input id="note" type="text" maxlength="200" placeholder="Note: what turned it / what felt flat?" autocomplete="off">
  <button id="bSave">SAVE &amp; NEXT</button>
</div>
<div id="jobs" class="panel" hidden>
  <div id="jhead" style="font-size:18px;font-weight:bold"></div>
  <div id="jlance"></div>
  <div class="jrow">
    <div class="job"><div id="j0" class="jintel"></div><button id="bJ0" class="jtake">TAKE JOB 1</button></div>
    <div class="job"><div id="j1" class="jintel"></div><button id="bJ1" class="jtake">TAKE JOB 2</button></div>
  </div>
  <button id="bReroll" style="opacity:.7;font-size:11px;min-height:40px">DEBUG: REROLL JOBS</button>
</div>
<div id="cres" class="panel" hidden>
  <div id="cTitle" style="font-size:24px;font-weight:bold"></div>
  <div id="cSub"></div>
  <div id="cHunts" class="jrow"></div>
  <div class="zrow"><button id="bSend2">SEND LOG</button><button id="bNewC">NEW CONTRACT</button></div>
</div>
<div id="tb" class="panel doc" hidden>
  <div class="dtitle">TEST BED <small style="font-size:12px;opacity:.7">· one mechanic, one hunt · no pay, no carry-over</small></div>
  <div id="tbList" class="dtext"></div>
  <div class="zrow"><button id="bTBCard">CARD</button><button id="bTBBack" class="go">BACK</button></div>
</div>
<div id="tbres" class="panel" hidden>
  <div id="tbTitle" style="font-size:18px;font-weight:bold"></div>
  <div id="tbTxt"></div>
  <div id="tbQ"></div>
  <div class="zrow"><button id="bTBRetry" class="go">RETRY</button><button id="bTBDone">BACK</button></div>
</div>
<div id="card" class="panel" hidden>
  <div id="cardGrid" class="cgrid"></div>
  <button id="bCardX" class="go">CLOSE</button>
</div>
<div id="idp" class="panel" hidden>
  <div id="idHead" class="idhead"></div>
  <div id="idGrid" class="cgrid"></div>
  <div class="zrow"><button id="bIdClear">NO ID</button><button id="bIdCard">CARD</button><button id="bIdX" class="go">CANCEL</button></div>
</div>
<div id="splash" class="panel doc">
  <div id="spTitle" class="dtitle"></div>
  <div id="spBody" class="dtext"></div>
  <input id="tester" type="text" maxlength="30" placeholder="Your name (for the log)" autocomplete="off">
  <div class="zrow"><button id="bPack">THE PACK: OFF</button><button id="bMap">MAP: NEW DISTRICTS</button></div>
  <div class="zrow"><button id="bBasics">GAMEPLAY BASICS</button><button id="bCont" class="go">CONTINUE</button></div>
</div>
<div id="basics" class="panel doc" hidden>
  <div class="dtitle">Gameplay basics</div>
  <div class="drow"><div id="bsText" class="dtext"></div><div id="bsArt" class="dart"></div></div>
  <button id="bBack" class="go">BACK</button>
</div>
<div id="rot">Rotate your phone</div>
